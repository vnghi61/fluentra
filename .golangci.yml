version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - containedctx
    - contextcheck
    - errcheck
    - gocyclo
    - goconst
    - gosec
    - govet
    - lll
    - nilerr
    - revive
    - sqlclosecheck
    - staticcheck

  settings:
    gocyclo:
      min-complexity: 15
    lll:
      line-length: 120

  exclusions:
    rules:
      # cmd/seed/content_data.go is authored curriculum, not code: two hundred
      # word senses and twenty-four exercises. goconst measures repeated string
      # literals, which in a data file means the answer to a question appearing
      # in its option id, its correct_answer and its acceptable list — naming
      # those would replace readable content with indirection. The keys and kinds
      # around the content *are* constants; see the const block in that file.
      # reading_writing_data.go is the same kind of file — passages, questions and
      # writing prompts — and takes the same exemption for the same reasons, as
      # does speaking_data.go: read-aloud references and spoken model answers are
      # sentences, and a sentence split across concatenated literals to satisfy a
      # column limit is a sentence nobody will edit correctly. listening_data.go
      # carries whole clip scripts, which are the longest of the lot: cmd/tts
      # synthesises the string exactly as written, so a script wrapped for a
      # column limit is a script with the wrap in it.
      - path: cmd/seed/(content_data|reading_writing_data|speaking_data|listening_data)\.go
        linters:
          - goconst
          # A reading passage is a paragraph. Breaking one across concatenated
          # string literals to satisfy a line-length rule written for code makes
          # the curriculum harder to read and to edit, which is the opposite of
          # what the rule is for.
          - lll
          # G101 matches identifiers against a credential pattern that includes
          # `pass`, and `cfgPassage` contains it. Every hit in this file is a
          # reading passage; there is no secret in authored curriculum.
          - gosec

      # The skill graders are tested against prose: a passage to comprehend and
      # a paragraph a learner wrote. Same argument as the seed above, and the
      # same two rules — the fixtures are the thing under test, not code around it.
      - path: internal/modules/(reading|writing)/service/grader_test\.go
        linters:
          - lll
          - gosec

      # The offline AI provider answers with canned items: a passage, its
      # questions, options and explanations in both languages. That is authored
      # content, the same kind of file as the seed above, and it takes the same
      # three exemptions for the same reasons.
      - path: internal/platform/ai/provider_mock\.go
        linters:
          - goconst
          - lll
          - gosec

formatters:
  enable:
    - gofmt
