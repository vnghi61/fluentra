version: "2"

# Each module adds an entry here when it adds its first db/queries/<module>/*.sql
# file. The bootstrap `ops` query keeps `sqlc generate` executable before a
# business module owns tables.
sql:
  - engine: postgresql
    queries: db/queries/ops
    schema:
      - db/migrations/_bootstrap
    gen:
      go:
        package: sqlc
        out: internal/generated/ops/sqlc
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type:
              import: github.com/google/uuid
              type: UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type:
              import: time
              type: Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true

  - engine: postgresql
    queries: db/queries/user
    # The bootstrap migration is included because it creates the `core` schema
    # and the roles the module migration grants to; sqlc parses the whole DDL
    # chain, not just the module's own file.
    schema:
      - db/migrations/_bootstrap
      - db/migrations/user
    gen:
      go:
        package: sqlc
        out: internal/generated/user/sqlc
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type:
              import: github.com/google/uuid
              type: UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type:
              import: time
              type: Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true

  - engine: postgresql
    queries: db/queries/rbac
    # core.user_roles foreign-keys to core.users, so the user migration is part
    # of this module's DDL chain even though the tables belong to rbac. sqlc
    # parses the chain, not just the module's own file.
    schema:
      - db/migrations/_bootstrap
      - db/migrations/user
      - db/migrations/rbac
    gen:
      go:
        package: sqlc
        out: internal/generated/rbac/sqlc
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type:
              import: github.com/google/uuid
              type: UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type:
              import: time
              type: Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
