  - engine: postgresql
    queries: db/queries/gamification
    # gamification owns tables in `learn` and reads none of anyone else's, but
    # sqlc parses the whole DDL chain: the earlier `learn` migrations have to be
    # here for the schema to be well-formed by the time this module's file runs.
    schema:
      - db/migrations/_bootstrap
      - db/migrations/user
      - db/migrations/content
      - db/migrations/lesson
      - db/migrations/learning
