<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Fluentra</title>
    <!--
      The theme is applied before React mounts. Doing it in a component means one
      painted frame in the wrong colours on every load, which reads as a flash.
      It is a blocking external script so the CSP can run script-src 'self'
      without 'unsafe-inline'.
    -->
    <script src="/theme-init.js"></script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
