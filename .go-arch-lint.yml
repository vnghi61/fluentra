# Module boundary enforcement — this file is what makes rules L1 and L2 real.
#
# Rule L1: a module may import only another module's `contract` package.
# Rule L2: a module may not touch another module's tables (enforced in review + SQL lint).
#
# This file and MODULE_INDEX.md §3 must agree. The `dep-drift` CI job checks that they do.
version: 3
workdir: internal

allow:
  depOnAnyVendor: false

# The three third-party packages every layer of every module touches.
#
# `depOnAnyVendor: false` exists to keep provider SDKs — S3, SMTP, Redis, an LLM
# client — out of business modules, so that swapping one is a change to a
# platform facade and nothing else. These three are not that. They are the
# substrate the repository's own shared primitives are written in: shared/id
# returns a uuid.UUID, dbx.InTx hands its callback a pgx.Tx, and shared/httpx
# builds a chi router. A module that may not import them cannot use the shared
# kernel at all.
#
# This was not discovered until the first module was written, because until then
# no code under internal/modules imported anything.
vendors:
  v_uuid: { in: github.com/google/uuid }
  v_pgx:  { in: [github.com/jackc/pgx/v5, github.com/jackc/pgx/v5/**] }
  v_chi:  { in: [github.com/go-chi/chi/v5, github.com/go-chi/chi/v5/**] }

  # Not common: granted to one component, m_auth_domain, and to nothing else.
  # It is a KDF, not a provider SDK — there is no external system behind it to
  # swap — so the reason depOnAnyVendor exists does not apply. It stays narrow
  # anyway, because the set of packages allowed to hash a password should be
  # exactly the set that does.
  v_argon2id: { in: github.com/alexedwards/argon2id }

  # Also not common, and granted to one component. A JWT library is not a
  # provider SDK — there is no external system behind it to swap — so the reason
  # depOnAnyVendor exists does not apply. It stays narrow anyway: the set of
  # packages allowed to mint a credential should be exactly the set that does.
  v_jwt: { in: [github.com/golang-jwt/jwt/v5, github.com/golang-jwt/jwt/v5/**] }

  # Granted to m_user_service for avatar image manipulation and resizing.
  v_imaging: { in: github.com/disintegration/imaging }
  v_ximage:  { in: [golang.org/x/image, golang.org/x/image/**] }

commonVendors:
  - v_uuid
  - v_pgx
  - v_chi

# `shared` holds the cross-cutting primitives (errors, ids, config, http
# helpers). Every component may use them, including the other shared packages,
# so they are declared common rather than repeated in every rule below.
commonComponents:
  - s_apperr
  - s_clock
  - s_config
  - s_dbx
  - s_eventbus
  - s_flags
  - s_httpx
  - s_i18n
  - s_id
  - s_idempotency
  - s_money
  - s_outbox
  - s_pagination
  - s_secret
  - s_validation

exclude:
  - mocks
  - testdata

excludeFiles:
  - "^.*_test\\.go$"
  # The namespace roots internal/modules and internal/platform hold only a
  # package doc.go. They import nothing, so there is nothing to constrain.
  - "^.*[\\\\/](modules|platform)[\\\\/]doc\\.go$"

# ---------------------------------------------------------------- components

components:
  # one component per shared primitive, so a dependency between two of them is
  # a real edge the linter can see rather than an invisible self-reference
  s_root:          { in: shared }
  s_apperr:        { in: shared/apperr }
  s_clock:         { in: shared/clock }
  s_config:        { in: shared/config }
  s_dbx:           { in: shared/dbx }
  s_eventbus:      { in: shared/eventbus }
  s_flags:         { in: shared/flags }
  s_httpx:         { in: shared/httpx }
  s_i18n:          { in: shared/i18n }
  s_id:            { in: shared/id }
  s_idempotency:   { in: shared/idempotency }
  s_money:         { in: shared/money }
  s_outbox:        { in: shared/outbox }
  s_pagination:    { in: shared/pagination }
  s_secret:        { in: shared/secret }
  s_validation:    { in: shared/validation }

  # These are exact paths, not `generated/**`. A `**` glob matches nothing at
  # all on Windows in go-arch-lint v1.17 while matching normally on Linux, so a
  # component declared with one is silently inert on a maintainer's machine and
  # enforced in CI. Exact paths behave the same on both, which is the only way
  # this gate means anything locally.
  #
  # sqlc output, one component per owning module. It is components rather than
  # an `exclude` entry so that the edges *into* it stay visible: a module
  # reaching for another schema's generated queries is exactly the L2 violation
  # this file exists to catch. One `generated: { in: generated/** }` component
  # would not catch it — granting a module its own queries would grant it
  # everybody's.
  g_ops:         { in: generated/ops/sqlc }
  g_job:         { in: generated/job/sqlc }
  g_auth:        { in: generated/auth/sqlc }
  g_user:        { in: generated/user/sqlc }
  g_rbac:        { in: generated/rbac/sqlc }
  g_audit:       { in: generated/audit/sqlc }

  # platform capabilities
  p_telemetry:   { in: platform/telemetry/** }
  p_cache:       { in: platform/cache/** }
  p_storage:     { in: platform/storage/** }
  p_job:         { in: platform/job/** }
  p_mailer:      { in: platform/mailer/** }
  p_ai:          { in: platform/ai/** }
  p_media:       { in: platform/media/** }
  p_search:      { in: platform/search/** }

  # contract packages — these are the only importable surfaces of a module
  c_auth:          { in: modules/auth/contract }
  c_user:          { in: modules/user/contract }
  c_rbac:          { in: modules/rbac/contract }
  c_audit:         { in: modules/audit/contract }
  c_admin:         { in: modules/admin/contract }
  c_notification:  { in: modules/notification/contract }
  c_content:       { in: modules/content/contract }
  c_lesson:        { in: modules/lesson/contract }
  c_learning:      { in: modules/learning/contract }
  c_srs:           { in: modules/srs/contract }
  c_vocabulary:    { in: modules/vocabulary/contract }
  c_grammar:       { in: modules/grammar/contract }
  c_reading:       { in: modules/reading/contract }
  c_listening:     { in: modules/listening/contract }
  c_speaking:      { in: modules/speaking/contract }
  c_writing:       { in: modules/writing/contract }
  c_questionbank:  { in: modules/questionbank/contract }
  c_exam:          { in: modules/exam/contract }
  c_gamification:  { in: modules/gamification/contract }
  c_analytics:     { in: modules/analytics/contract }
  c_subscription:  { in: modules/subscription/contract }
  c_payment:       { in: modules/payment/contract }

  # module internals — never importable from outside the module itself
  #
  # A module with code is declared one component per layer, not one component
  # for the whole module. Two reasons. go-arch-lint reports an import between
  # two packages of the same component as a violation, and listing the component
  # in its own `mayDependOn` does not change that — so a lumped component cannot
  # describe a module that has a service and a repository. And splitting them
  # lets the linter enforce the layering in /AGENT.md §6 (transport -> service ->
  # repository -> domain, always inward), which a single component cannot see.
  #
  # Modules without code keep the `**` form until they get some; it is correct
  # for a module that is one package, and it is what the next module changes
  # when it grows a second.
  m_auth:            { in: modules/auth }
  m_auth_domain:     { in: modules/auth/domain }
  m_auth_repository: { in: modules/auth/repository }
  m_auth_service:    { in: modules/auth/service }
  # The Google adapter. It is its own component because it is the one package in
  # this module that speaks to an external provider: it needs net/http and the
  # JWT vendor, and neither belongs to `service` at large.
  m_auth_oauth:      { in: modules/auth/service/oauth/google }
  m_auth_http:       { in: modules/auth/transport/http }
  m_user:          { in: modules/user }
  m_user_domain:   { in: modules/user/domain }
  m_user_repository: { in: modules/user/repository }
  m_user_service:  { in: modules/user/service }
  m_user_http:     { in: modules/user/transport/http }
  m_rbac:          { in: modules/rbac }
  m_rbac_domain:   { in: modules/rbac/domain }
  m_rbac_repository: { in: modules/rbac/repository }
  m_rbac_service:  { in: modules/rbac/service }
  m_rbac_http:     { in: modules/rbac/transport/http }
  m_audit:         { in: modules/audit }
  m_audit_domain:  { in: modules/audit/domain }
  m_audit_repository: { in: modules/audit/repository }
  m_audit_service: { in: modules/audit/service }
  m_audit_http:    { in: modules/audit/transport/http }
  m_admin:         { in: modules/admin/** }
  m_notification:  { in: modules/notification/** }
  m_content:       { in: modules/content/** }
  m_lesson:        { in: modules/lesson/** }
  m_learning:      { in: modules/learning/** }
  m_srs:           { in: modules/srs/** }
  m_vocabulary:    { in: modules/vocabulary/** }
  m_grammar:       { in: modules/grammar/** }
  m_reading:       { in: modules/reading/** }
  m_listening:     { in: modules/listening/** }
  m_speaking:      { in: modules/speaking/** }
  m_writing:       { in: modules/writing/** }
  m_questionbank:  { in: modules/questionbank/** }
  m_exam:          { in: modules/exam/** }
  m_gamification:  { in: modules/gamification/** }
  m_analytics:     { in: modules/analytics/** }
  m_subscription:  { in: modules/subscription/** }
  m_payment:       { in: modules/payment/** }

# ------------------------------------------------------------------- rules
# `mayDependOn` lists are deliberately minimal. Adding an entry here is a
# boundary change: update MODULE_INDEX.md §3 in the same commit, and consider
# whether it needs an ADR.
#
# Two entries are not boundary changes and appear on every module that has code:
# the component itself (`m_x`), because a module's layers import each other, and
# its own contract (`c_x`), because the service is what implements it. Neither
# crosses a boundary, and the dep-drift check skips them for that reason.

deps:
  s_root:          { anyVendorDeps: true }
  s_apperr:        { anyVendorDeps: true }
  s_clock:         { anyVendorDeps: true }
  s_config:        { anyVendorDeps: true }
  s_dbx:           { anyVendorDeps: true }
  s_eventbus:      { anyVendorDeps: true }
  s_flags:         { anyVendorDeps: true }
  s_httpx:         { anyVendorDeps: true }
  s_i18n:          { anyVendorDeps: true }
  s_id:            { anyVendorDeps: true }
  s_idempotency:   { anyVendorDeps: true }
  s_money:         { anyVendorDeps: true }
  s_outbox:        { anyVendorDeps: true }
  s_pagination:    { anyVendorDeps: true }
  s_secret:        { anyVendorDeps: true }
  s_validation:    { anyVendorDeps: true }

  # sqlc emits pgx types, so it needs the vendor allowance. It depends on nothing
  # of ours, which is what makes it safe for its owner to import.
  g_ops:       { anyVendorDeps: true }
  g_job:       { anyVendorDeps: true }
  g_auth:      { anyVendorDeps: true }
  g_user:      { anyVendorDeps: true }
  g_rbac:      { anyVendorDeps: true }
  g_audit:     { anyVendorDeps: true }

  # A platform capability exists to wrap a vendor SDK, so each may import one.
  # Business modules deliberately may not: they reach external systems through
  # these facades, which is what keeps an SDK swappable.
  p_telemetry: { anyVendorDeps: true }
  p_cache:     { mayDependOn: [p_telemetry], anyVendorDeps: true }
  p_storage:   { mayDependOn: [p_telemetry, p_job], anyVendorDeps: true }
  p_job:       { mayDependOn: [p_telemetry, g_job], anyVendorDeps: true }
  p_mailer:    { mayDependOn: [p_telemetry, p_job, p_storage], anyVendorDeps: true }
  p_ai:        { mayDependOn: [p_telemetry, p_cache, p_job], anyVendorDeps: true }
  p_media:     { mayDependOn: [p_telemetry, p_storage, p_job, p_ai], anyVendorDeps: true }
  p_search:    { mayDependOn: [p_telemetry, p_cache, p_job], anyVendorDeps: true }

  # auth, by layer. Transport does not exist yet — it arrives with registration
  # in P2.2 — so it is not declared; a component for a package that does not
  # exist is a rule nothing is checked against.
  #
  # m_auth_domain is the one place in the repository allowed to hash a password.
  # It has no mayDependOn because it imports nothing of ours beyond the shared
  # kernel, which is what keeps the policy, the verifier and the OTP primitives
  # testable with no setup at all.
  m_auth_domain:     { canUse: [v_argon2id] }
  # p_cache is here for the token denylist, which is a cache-backed store rather
  # than a table. ADR-0007 rejected server-side sessions specifically to keep a
  # datastore read off the authentication path, so putting the denylist in
  # Postgres would put that read straight back — which is why this one
  # repository speaks to Redis.
  m_auth_repository: { mayDependOn: [m_auth_domain, g_auth, p_cache] }
  # m_auth_oauth verifies Google's ID tokens, so it needs the JWT vendor for the
  # same reason m_auth_service does — and it is the only component here allowed
  # to hold an HTTP client pointed at a third party. It depends on nothing of
  # ours: it returns its own Identity and its own error sentinels, which is what
  # lets the five linking branches be tested against a fake rather than against
  # Google.
  m_auth_oauth:      { canUse: [v_jwt] }
  m_auth_service:    { mayDependOn: [m_auth_domain, m_auth_oauth, c_auth, p_cache], canUse: [v_jwt] }
  # m_auth_service is here for the same reason it is on m_audit_http and
  # m_rbac_http: module.go passes the concrete *service.RegisterService into
  # authhttp.NewHandler, and go-arch-lint's deepScan reads that injection as an
  # edge from m_auth_http into m_auth_service. Without this entry the check
  # fails on Linux. It is not a widening: transport -> service is the direction
  # /AGENT.md §6 prescribes.
  m_auth_http:       { mayDependOn: [m_auth_domain, m_auth_service] }
  m_auth:            { mayDependOn: [m_auth_domain, m_auth_repository, m_auth_service, m_auth_oauth, m_auth_http, c_auth, p_cache, p_telemetry, p_mailer, p_job, c_user, c_rbac, c_audit] }

  # user, by layer. Reading down this block is reading the dependency direction:
  # domain depends on nothing of ours, and each layer above it may reach only
  # inward. The composition root (module.go) is the one place that sees every
  # layer, because assembling them is what it is for.
  # m_user_domain has no rule at all: it imports nothing of ours beyond the
  # shared kernel, which is what makes it testable with zero setup, and the
  # linter rejects both an empty mayDependOn and a rule with no allowance.
  m_user_repository: { mayDependOn: [m_user_domain, g_user] }
  m_user_service:    { mayDependOn: [m_user_domain, c_user, p_storage, p_telemetry, p_mailer, p_job, c_audit], canUse: [v_imaging, v_ximage] }
  m_user_http:       { mayDependOn: [m_user_domain, m_user_service] }
  m_user:            { mayDependOn: [m_user_domain, m_user_repository, m_user_service, m_user_http, c_user, p_storage] }

  # rbac, by layer. The domain depends on its own contract because the guard's
  # types — Permission, Role — are the contract: they are what other modules
  # pass in, so putting them anywhere else would mean two names for one thing.
  m_rbac_domain:     { mayDependOn: [c_rbac] }
  m_rbac_repository: { mayDependOn: [m_rbac_domain, c_rbac, g_rbac] }
  m_rbac_service:    { mayDependOn: [m_rbac_domain, c_rbac, p_cache, p_telemetry, c_audit] }
  m_rbac_http:       { mayDependOn: [m_rbac_domain, m_rbac_service, c_rbac] }
  m_rbac:            { mayDependOn: [m_rbac_domain, m_rbac_repository, m_rbac_service, m_rbac_http, c_rbac] }
  # audit, by layer. The list is short in a way that is worth noticing: this
  # module names no other module's contract at all. Every arrow in
  # MODULE_INDEX.md §3 points into `audit`, so it consumes other modules'
  # events by convention over the payload rather than by importing their types
  # — see service/consumer.go. Its own guard and its own recorder interfaces
  # are what the composition root adapts.
  m_audit_domain:     { mayDependOn: [c_audit] }
  m_audit_repository: { mayDependOn: [m_audit_domain, c_audit, g_audit] }
  m_audit_service:    { mayDependOn: [m_audit_domain, c_audit] }
  # m_audit_service is here for the same reason it is on m_rbac_http, and the
  # reason is the `deepScan` linter rather than an import. The handler imports
  # nothing from service/ — it declares its own `Trail` and `Guard` interfaces.
  # But module.go passes the concrete *service.Service into NewHandler, and
  # go-arch-lint reads that injection as an edge and checks it against the
  # receiving component's allowance. Omitting it fails on Linux and passes on
  # Windows, which is how it reached CI.
  #
  # It is not a widening: transport -> service is the direction /AGENT.md §6
  # prescribes. What would be wrong is the reverse.
  m_audit_http:       { mayDependOn: [m_audit_domain, m_audit_service, c_audit] }
  m_audit:            { mayDependOn: [m_audit_domain, m_audit_repository, m_audit_service, m_audit_http, c_audit, p_job, p_telemetry] }
  m_admin:        { mayDependOn: [p_cache, p_telemetry, c_user, c_rbac, c_audit, c_auth, c_content, c_analytics, c_subscription] }
  m_notification: { mayDependOn: [p_mailer, p_job, p_cache, p_telemetry, c_user] }

  # learning
  m_content:      { mayDependOn: [p_storage, p_search, p_ai, p_media, p_cache, p_telemetry, c_audit] }
  m_lesson:       { mayDependOn: [p_cache, p_telemetry, c_content] }
  m_learning:     { mayDependOn: [p_cache, p_job, p_telemetry, c_lesson, c_content, c_srs] }
  m_srs:          { mayDependOn: [p_cache, p_job, p_telemetry, c_content] }
  m_vocabulary:   { mayDependOn: [p_cache, p_media, p_ai, p_search, p_telemetry, c_content, c_srs, c_learning] }
  m_grammar:      { mayDependOn: [p_cache, p_ai, p_telemetry, c_content, c_srs, c_learning] }
  m_reading:      { mayDependOn: [p_cache, p_telemetry, c_content, c_questionbank, c_vocabulary, c_learning] }
  m_listening:    { mayDependOn: [p_cache, p_media, p_storage, p_telemetry, c_content, c_questionbank, c_learning] }
  m_speaking:     { mayDependOn: [p_media, p_ai, p_storage, p_job, p_telemetry, c_content, c_learning] }
  m_writing:      { mayDependOn: [p_ai, p_job, p_telemetry, c_content, c_learning, c_notification] }
  m_questionbank: { mayDependOn: [p_ai, p_search, p_telemetry, c_content, c_audit] }
  m_exam:         { mayDependOn: [p_job, p_ai, p_telemetry, c_questionbank, c_writing, c_speaking, c_learning] }
  m_gamification: { mayDependOn: [p_cache, p_job, p_telemetry, c_learning, c_srs, c_notification] }

  # commerce
  m_analytics:    { mayDependOn: [p_job, p_cache, p_telemetry] }
  m_subscription: { mayDependOn: [p_cache, p_job, p_telemetry, c_payment, c_user, c_notification, c_audit] }
  m_payment:      { mayDependOn: [p_job, p_mailer, p_storage, p_telemetry, c_subscription, c_audit] }
