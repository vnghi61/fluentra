services:
  grafana:
    # Keep this overlay valid with the base file alone. The observability
    # overlay supplies the datasource/config mounts used at runtime.
    image: grafana/grafana:latest
    ports: !reset []
    restart: unless-stopped
    logging: &json_logging
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
  otel-collector:
    # The production acceptance check composes base + prod without the
    # optional observability overlay, so the service still needs an image.
    image: otel/opentelemetry-collector-contrib:latest
    ports: !reset []
    restart: unless-stopped
    logging: *json_logging
  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    volumes: [../nginx/nginx.conf:/etc/nginx/nginx.conf:ro]
    networks: [frontend, backend]
    restart: unless-stopped
    logging: *json_logging
    deploy: { resources: { limits: { cpus: "0.5", memory: 128M } } }
  postgres:
    restart: unless-stopped
    logging: *json_logging
    deploy: { resources: { limits: { cpus: "2.0", memory: 4G } } }
  redis:
    restart: unless-stopped
    logging: *json_logging
    deploy: { resources: { limits: { cpus: "0.5", memory: 512M } } }
  minio:
    restart: unless-stopped
    logging: *json_logging
    deploy: { resources: { limits: { cpus: "0.5", memory: 512M } } }
