name: fluentra

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fluentra
      POSTGRES_USER: fluentra
      POSTGRES_PASSWORD: fluentra
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U fluentra -d fluentra]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes: [redisdata:/data]
    networks: [backend]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # MinIO publishes no images any more: minio/minio and quay.io/minio both
    # refuse a pull. Chainguard's build is maintained and ships `mc` and bash,
    # but no curl, and runs as uid 65532, which cannot write a fresh volume.
    image: cgr.dev/chainguard/minio:latest
    user: "0"
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # Lets the healthcheck's `mc ready local` reach this server with no alias step.
      MC_HOST_local: http://minioadmin:minioadmin@localhost:9000
    volumes: [miniodata:/data]
    networks: [backend]
    healthcheck:
      test: [CMD, mc, ready, local]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  redisdata:
  miniodata:

networks:
  frontend:
  backend:
    internal: true
