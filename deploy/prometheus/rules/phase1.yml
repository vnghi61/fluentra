groups:
  - name: api
    interval: 30s
    rules:
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 5m
        annotations:
          summary: "API error rate > 5%"
          runbook_url: "https://fluentra.dev/runbooks/high-error-rate"

      - alert: SlowRequests
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 10m
        annotations:
          summary: "P95 latency > 2s"
          runbook_url: "https://fluentra.dev/runbooks/slow-requests"

  - name: database
    rules:
      - alert: DatabaseConnectionPoolExhausted
        expr: pg_pool_active_connections / pg_pool_max_connections > 0.9
        for: 5m
        annotations:
          summary: "Database connection pool usage > 90%"
          runbook_url: "https://fluentra.dev/runbooks/db-pool-exhausted"

      - alert: SlowQueries
        expr: rate(pg_slow_queries_total[5m]) > 10
        for: 10m
        annotations:
          summary: "Slow queries rate > 10/5m"
          runbook_url: "https://fluentra.dev/runbooks/slow-queries"

  - name: jobs
    rules:
      - alert: JobQueueBacklog
        expr: river_queue_depth{queue="default"} > 1000
        for: 15m
        annotations:
          summary: "River job queue depth > 1000"
          runbook_url: "https://fluentra.dev/runbooks/job-queue-backlog"

      - alert: JobFailureRateHigh
        expr: rate(river_job_completed_total{state="failed"}[5m]) / rate(river_job_completed_total[5m]) > 0.1
        for: 10m
        annotations:
          summary: "Job failure rate > 10%"
          runbook_url: "https://fluentra.dev/runbooks/job-failures"

  - name: security
    rules:
      - alert: LoginLockoutSpike
        expr: rate(auth_lockout_total[5m]) > 50
        for: 5m
        annotations:
          summary: "Auth login lockout spike > 50/5m"
          runbook_url: "https://fluentra.dev/runbooks/lockout-spike"

      - alert: RefreshReuseDetected
        expr: rate(auth_refresh_reuse_total[1m]) > 0
        for: 1m
        annotations:
          severity: "critical"
          summary: "Refresh token reuse detected"
          runbook_url: "https://fluentra.dev/runbooks/refresh-reuse"
