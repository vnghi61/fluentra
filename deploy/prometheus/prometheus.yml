# Prometheus scrapes the collector rather than the application directly. The
# application only speaks OTLP push; an empty scrape_configs meant every metric
# the API produced was exported into a collector that had nowhere to put it.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
