name: ci-frontend

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'api/openapi/**'
      - 'deploy/docker/**'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - 'api/openapi/**'
      - 'deploy/docker/**'
      - '.github/workflows/ci-frontend.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: web

jobs:
  verify:
    name: Frontend CI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # package_json_file is resolved from the repository root, not from
      # `defaults.run.working-directory` — that setting only applies to `run:`
      # steps, never to a `uses:` action. There is no package.json at the root,
      # so without this the action looks in the wrong place, finds no
      # `packageManager` field, and fails with "No pnpm version is specified".
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: web/package.json

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The generated client is checked the same way the Go one is: regenerate
      # and require no diff. A hand-edited api.ts silently diverging from the
      # spec is the frontend's version of a stale server stub.
      - name: Verify the generated API types are current
        run: |
          pnpm run gen:api
          git diff --exit-code src/types/api.ts

      # Full strict TypeScript, including noUncheckedIndexedAccess and
      # exactOptionalPropertyTypes.
      - name: Type-check
        run: pnpm run typecheck

      # eslint-plugin-boundaries is the frontend's arch-lint: it fails on a deep
      # import across feature slices.
      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      # `build` ends in scripts/check-bundle.mjs, which fails when the initial
      # download exceeds its gzipped budget.
      - name: Build and enforce the bundle budget
        run: pnpm run build

  e2e:
    name: Frontend E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fluentra_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fluentra_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Start MinIO and Mailpit
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          docker run -d --name mailpit -p 8025:8025 -p 1025:1025 \
            axllent/mailpit:latest
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9000/minio/health/live && curl -sf http://127.0.0.1:8025/api/v1/messages; then exit 0; fi
            sleep 1
          done
          echo "Data services failed to start"; exit 1

      - name: Apply DB migrations and start API backend
        working-directory: .
        env:
          DB_DSN: postgres://postgres:postgres@127.0.0.1:5432/fluentra_test?sslmode=disable
          REDIS_URL: redis://127.0.0.1:6379/0
          HTTP_PORT: '8080'
          SMTP_HOST: 127.0.0.1
          SMTP_PORT: '1025'
          S3_ENDPOINT: http://127.0.0.1:9000
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadmin
          CORS_ALLOWED_ORIGINS: http://localhost:5173
        run: |
          export OTP_HMAC_KEY="$(openssl rand -hex 32)"
          export JWT_SIGNING_KEY="$(openssl rand -hex 32)"
          go run ./cmd/migrate up
          go run ./cmd/api &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/ready || curl -sf http://127.0.0.1:8080/api/v1/health; then echo "API is ready"; exit 0; fi
            sleep 1
          done
          echo "API never became ready"; exit 1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: web/package.json

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Run E2E tests against real backend
        run: pnpm run test:e2e

      - name: Upload Playwright report & traces
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: always()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 14

  build-dev-image:
    name: Build Go Dev Image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Dockerfile.go.dev
        run: docker build -f deploy/docker/Dockerfile.go.dev -t fluentra-go-dev:ci .
