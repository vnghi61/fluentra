name: ci-frontend

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'api/openapi/**'
      - 'deploy/docker/**'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - 'api/openapi/**'
      - 'deploy/docker/**'
      - '.github/workflows/ci-frontend.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: web

jobs:
  verify:
    name: Frontend CI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # package_json_file is resolved from the repository root, not from
      # `defaults.run.working-directory` — that setting only applies to `run:`
      # steps, never to a `uses:` action. There is no package.json at the root,
      # so without this the action looks in the wrong place, finds no
      # `packageManager` field, and fails with "No pnpm version is specified".
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: web/package.json

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The generated client is checked the same way the Go one is: regenerate
      # and require no diff. A hand-edited api.ts silently diverging from the
      # spec is the frontend's version of a stale server stub.
      - name: Verify the generated API types are current
        run: |
          pnpm run gen:api
          git diff --exit-code src/types/api.ts

      # Full strict TypeScript, including noUncheckedIndexedAccess and
      # exactOptionalPropertyTypes.
      - name: Type-check
        run: pnpm run typecheck

      # eslint-plugin-boundaries is the frontend's arch-lint: it fails on a deep
      # import across feature slices.
      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      # `build` ends in scripts/check-bundle.mjs, which fails when the initial
      # download exceeds its gzipped budget.
      - name: Build and enforce the bundle budget
        run: pnpm run build

  e2e:
    name: Frontend E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: web/package.json

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm run test:e2e

      - name: Upload Playwright report & traces
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: always()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 14

  build-dev-image:
    name: Build Go Dev Image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Dockerfile.go.dev
        run: docker build -f deploy/docker/Dockerfile.go.dev -t fluentra-go-dev:ci .
