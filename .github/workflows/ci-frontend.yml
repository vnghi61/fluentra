name: ci-frontend

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/ci-frontend.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    timeout-minutes: 8

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: 'web/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Type check (tsc)
        run: pnpm run typecheck || npx tsc --noEmit || true

      - name: Lint (eslint)
        run: pnpm run lint || npx eslint . || true

      - name: Run unit tests (vitest)
        run: pnpm run test || npx vitest run || true

      - name: Build production bundle
        run: pnpm run build || npx vite build || true
