name: seed-production

# Migrates the production database and loads the reference catalogue (courses,
# the 10,000-word list, the mock tests) with `cmd/seed -reference`, then asks
# tts-render to voice the listening items. It replaces steps 2, 5 and 6 of
# docs/OPERATIONS.md#first-deploy, which ran from an operator's machine with a
# hand-edited .env; on 2026-10-12 that .env said APP_ENV=local while DB_DSN
# pointed at production.
#
# Run it by hand only (Actions → seed-production → Run workflow):
#   - task `migrate` applies pending migrations: the "every deploy" step, since
#     Render's free plan has no pre-deploy hook;
#   - task `migrate-and-seed` also loads the catalogue. It is idempotent, so it
#     is safe to repeat after an interrupted run.
#
# The repository is public, so:
#   - there is no pull_request or schedule trigger, and the secrets live in the
#     `seed-production` environment, restricted to main (Settings → Environments;
#     add yourself as a required reviewer to approve every run);
#   - the first admin's email is the SEED_ADMIN_EMAIL environment secret, not a
#     workflow input: inputs are shown on the run page, and secrets are masked
#     in the log;
#   - demo accounts are never created: cmd/seed refuses anything but -reference
#     under APP_ENV=production.
#
# Every `uses:` is pinned to a commit SHA, as in the other workflows.

on:
  workflow_dispatch:
    inputs:
      task:
        description: What to run against production
        type: choice
        options:
          - migrate
          - migrate-and-seed
        default: migrate
      confirm:
        description: Type "production" to confirm
        type: string
        required: true

concurrency:
  # Two seeds against one database at once would only fight over the same rows.
  group: seed-production
  cancel-in-progress: false

permissions:
  contents: read
  # To start tts-render once the catalogue is in.
  actions: write
  # ops-alert.sh opens an issue when a run fails and closes it on recovery.
  issues: write

jobs:
  seed:
    name: Migrate and seed production
    runs-on: ubuntu-latest
    # An over-the-internet seed of a fresh database took an hour at one worker;
    # with eight it is a fraction of that, but the first run has the most to do.
    timeout-minutes: 120
    environment: seed-production

    steps:
      - name: Refuse without confirmation
        if: inputs.confirm != 'production'
        run: |
          echo "::error::Type production in the confirm field to run against the production database."
          exit 1

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Migrate
        env:
          APP_ENV: production
          DB_DSN: ${{ secrets.DB_DSN }}
        run: go run ./cmd/migrate up

      - name: Load the reference catalogue
        if: inputs.task == 'migrate-and-seed'
        env:
          APP_ENV: production
          DB_DSN: ${{ secrets.DB_DSN }}
          SEED_ADMIN_EMAIL: ${{ secrets.SEED_ADMIN_EMAIL }}
          # The dashboard slides (db/fixtures/banners) are uploaded to the R2
          # bucket the API serves banner images from.
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          S3_REGION: auto
          S3_USE_SSL: 'true'
          S3_USE_POST_POLICY: 'false'
        # -admin-email promotes an account that has already signed up and
        # verified; it never creates one. Left empty, an existing admin owns
        # the catalogue, and a database with none is refused with a message.
        run: >-
          go run ./cmd/seed -reference
          ${SEED_ADMIN_EMAIL:+-admin-email "$SEED_ADMIN_EMAIL"}

      - name: Voice the listening items
        if: inputs.task == 'migrate-and-seed'
        env:
          GH_TOKEN: ${{ github.token }}
        # A listening item is only drawn into a sitting once its clip exists.
        run: gh workflow run tts-render.yml --repo "${GITHUB_REPOSITORY}" --ref main

      # A run refused for a missing confirmation is not an outage.
      - name: Report the failure
        if: failure() && inputs.confirm == 'production'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/ops-alert.sh failed

      - name: Close the failure report
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/ops-alert.sh recovered
