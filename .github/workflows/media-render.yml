name: media-render

# Renders derived media renditions (thumbnails, display, preview, web audio,
# video posters and resolutions) into fluentra-derived and records them in
# resource.renditions. Work order 18 §1 & §8: keep ffmpeg, poppler and LibreOffice
# off the production worker machine and render offline in GitHub Actions.
#
# Two triggers:
# 1. The worker dispatches this workflow as soon as a file resource is validated
#    (MEDIA_DISPATCH_* on the worker).
# 2. An hourly schedule (offset at :47) catches anything a dispatch missed.
#
# Environment: media-production (restricted to the main branch).

on:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:

concurrency:
  group: media-render
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  render:
    name: Render resource media renditions
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: media-production

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install media conversion tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            poppler-utils \
            libreoffice-writer-nogui \
            libreoffice-calc-nogui \
            libreoffice-impress-nogui

      - name: Render media renditions
        env:
          APP_ENVIRONMENT: production
          DB_DSN: ${{ secrets.DB_DSN }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          S3_REGION: auto
          S3_USE_SSL: 'true'
        run: go run ./cmd/media -all -limit 50
