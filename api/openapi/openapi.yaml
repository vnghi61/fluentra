          description: Word state updated.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserWordState'
              example:
                user_id: 0199a1c2-3d4e-7f80-9abc-def012345679
                word_sense_id: 0199a1c2-3d4e-7f80-9abc-def01234567c
                status: known
                first_seen_at: '2026-08-01T09:00:00Z'
                updated_at: '2026-08-25T09:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/vocabulary/words:
    post:
      tags: [vocabulary]
      operationId: adminCreateWord
      summary: Create a word entry.
      description: >-
        Creates or refreshes a dictionary entry and its senses. Re-importing an
        existing lemma and part of speech updates it rather than duplicating it.
      x-permission: content.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWordRequest'
      responses:
        '201':
          description: Word created.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WordDetail'
              example:
                id: 0199a1c2-3d4e-7f80-9abc-def01234567b
                lemma: meticulous
                pos: adjective
                cefr_level: B2
                frequency_rank: 4821
                ipa: /məˈtɪkjələs/
                senses:
                  - id: 0199a1c2-3d4e-7f80-9abc-def01234567c
                    word_id: 0199a1c2-3d4e-7f80-9abc-def01234567b
                    definition: Showing great attention to detail.
                    definition_vi: Tỉ mỉ, cẩn thận.
                    examples:
                      - sentence: She kept meticulous records of every transaction.
                    created_at: '2026-08-01T09:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
