openapi: 3.1.0
info:
  title: Fluentra API
  version: 0.1.0
  description: >-
    The versioned HTTP contract for Fluentra. Public operations explicitly set
    `security: []`; every other operation must declare its required permission.


    **Every response carries the `RateLimit-Limit`, `RateLimit-Remaining` and
    `RateLimit-Reset` headers**, describing the tightest budget the request was
    charged against. They are documented once here rather than repeated on each
    operation: the middleware sets them on the way out for all of them, and
    OpenAPI has no way to say that in one place. Where they appear explicitly --
    on the 429 response -- it is because that is where a client's behaviour
    depends on reading them.


    The classes are in `API_GUIDELINE.md` §11: 60/min per IP for anonymous
    callers, 600/min per user once signed in, and 5/min per IP **and** per
    account on the operations that hand out or reset a credential. A caller can
    be inside one budget and outside another; the response describes whichever
    one refused it.
  contact:
    name: Fluentra backend team
    url: https://github.com/fluentra/fluentra
servers:
  - url: /api/v1
    description: Version 1 API
tags:
  - name: system
    description: Platform health and diagnostics.
  - name: auth
    description: >-
      Proving who a caller is, and managing the identity once proved.


      The operations that acquire an identity are public -- requiring one to get
      one would be circular. The operations that act on an identity the caller
      already holds, such as listing and revoking sessions, require it like any
      other.
  - name: user
    description: >-
      The caller's own account: profile and preferences. Every operation here
      acts on the actor in the access token, never on a user id in the path.
  - name: rbac
    description: >-
      Roles and permissions. What the caller may do, and the administrative
      operations that change it.
  - name: audit
    description: >-
      The record of what happened. Append-only: there is no operation here that
      edits or removes an audit entry, and the application database role holds
      no grant that would let one exist.
security:
  - BearerAuth: []
paths:
  /ping:
    get:
      tags: [system]
      operationId: systemPing
      summary: Check API dependency connectivity.
      description: Performs lightweight PostgreSQL and Redis checks for the trace proof.
      security: []
      responses:
        '200':
          description: The API and its immediate dependencies responded.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ping'
              example:
                status: ok
  /health:
    get:
      tags: [system]
      operationId: systemHealth
      summary: Check process liveness.
      description: Returns success when the API process is able to serve requests.
      security: []
      responses:
        '200':
          description: The API process is live.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
  /ready:
    get:
      tags: [system]
      operationId: systemReady
      summary: Check dependency readiness.
      description: Returns success only when every hard dependency is usable.
      security: []
      responses:
        '200':
          description: All hard dependencies are ready.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ready'
              example:
                status: ready
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /version:
    get:
      tags: [system]
      operationId: systemVersion
      summary: Read the deployed API version.
      description: Returns the version associated with the running API build.
      security: []
      responses:
        '200':
          description: The deployed API version.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
              example:
                version: 0.1.0
  /auth/register:
    post:
      tags: [auth]
      operationId: authRegister
      summary: Open an account and start email verification.
      description: >-
        Creates the account and issues a `verify_email` challenge. The
        six-digit code goes to the address by email; the response carries only
        the challenge handle.


        This operation never reveals whether an address is already registered.
        An address that is already verified gets the same response shape as a
        fresh registration, and its owner receives a "someone tried to register
        with your address" email instead of a code -- so a caller probing for
        accounts learns nothing from either the status or the body.


        An address registered but **not yet** verified is treated as a fresh
        registration: the submitted password replaces the stored one and a new
        challenge is issued. Reissuing the pending challenge instead would be an
        account-takeover path -- somebody registers an address they do not own,
        its real owner registers it too, receives the code, verifies, and ends
        up with an account whose password the first party chose.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              email: learner@example.com
              password: a perfectly fine passphrase
              display_name: Nghi
              locale: vi
              timezone: Asia/Ho_Chi_Minh
      responses:
        '201':
          description: >-
            A challenge was issued. This is also the response when the address
            was already registered -- deliberately indistinguishable.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Challenge'
              example: &challengeExample
                challenge_id: 0199a1c2-3d4e-7f80-9abc-def012345678
                purpose: verify_email
                expires_at: '2026-08-10T09:10:00Z'
                resend_after: '2026-08-10T09:01:00Z'
                attempts_remaining: 5
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/login:
    post:
      tags: [auth]
      operationId: authLogin
      summary: Exchange a password for an access token.
      description: >-
        Authenticates an account and signs it in.


        An unknown email and a wrong password return the same body and take
        comparable time (BR-AUTH-02) -- the server performs a dummy password
        verification for an address it has never seen, so response time cannot
        be used to enumerate accounts. Per-account and per-IP lockout counters
        are independent (BR-AUTH-08): locking one does not lock the other.


        Three refusals are distinguishable on purpose, because the learner's
        next move differs for each: `EMAIL_NOT_VERIFIED` (403) for an address
        never proved, `ACCOUNT_SUSPENDED` (403) for an account an administrator
        disabled, and `ACCOUNT_LOCKED` (429) for too many failed attempts --
        which, unlike the other two, clears itself.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: learner@example.com
              password: a-secret-password
      responses:
        '200':
          description: The caller is signed in.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Set-Cookie:
              $ref: '#/components/headers/Set-Cookie-Refresh'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
              example: &authSessionExample
                access_token: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJleGFtcGxlIn0.example-signature # gitleaks:allow
                token_type: Bearer
                expires_in: 900
                user_id: 0199a1c2-3d4e-7f80-9abc-def012345678
                role: user
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/challenges/{id}/verify:
    parameters:
      - name: id
        in: path
        required: true
        description: The challenge handle returned when it was issued.
        schema:
          type: string
          format: uuid
    post:
      tags: [auth]
      operationId: authVerifyChallenge
      summary: Submit the code for a challenge.
      description: >-
        Accepts the six digits and consumes the challenge. For a `verify_email`
        challenge this marks the address verified.


        The code is single-use and expires ten minutes after issuance. Five
        wrong codes burn the challenge permanently -- a new one must be
        requested rather than retried. A wrong code returns 401 with the number
        of attempts left in `meta`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyChallengeRequest'
            example:
              code: '482913'
      responses:
        '200':
          description: The code was accepted and the challenge consumed.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Set-Cookie:
              $ref: '#/components/headers/Set-Cookie-Refresh'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifiedChallenge'
              example:
                purpose: verify_email
                verified_at: '2026-08-10T09:03:12Z'
                session: *authSessionExample
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/challenges/{id}/resend:
    parameters:
      - name: id
        in: path
        required: true
        description: The challenge to send a new code for.
        schema:
          type: string
          format: uuid
    post:
      tags: [auth]
      operationId: authResendChallenge
      summary: Send a new code for a challenge.
      description: >-
        Replaces the code and clears the attempt count. It does **not** extend
        `expires_at`: resending gives the learner a fresh code, not an
        indefinitely valid challenge.


        There is a 60-second cooldown per challenge and a cap on issuances per
        address per hour. A challenge that is already burned cannot be resent --
        request a new one.
      security: []
      responses:
        '200':
          description: A new code was sent.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Challenge'
              example: *challengeExample
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/refresh:
    post:
      tags: [auth]
      operationId: authRefresh
      summary: Rotate the refresh token and issue a new access token.
      description: >-
        Exchanges the `refresh_token` cookie for a fresh access token and a
        fresh refresh cookie. There is no request body: the credential is the
        cookie, which the browser attaches on its own and no script can read.


        A refresh token is single-use (BR-AUTH-04). The exchange spends the one
        presented and the response always replaces it, so a client that ignores
        the `Set-Cookie` has signed itself out.


        **Single use is what makes theft detectable.** A stolen token works
        exactly once. Whichever party presents the token second -- the thief or
        the real client -- is presenting one that has already been spent, and at
        that moment the server has no way to tell which of the two is genuine.
        So it stops trusting both: every token in the family is revoked, the
        session is revoked, a `refresh_reuse` security event is raised, and this
        operation answers 401 `SESSION_REVOKED`. The learner signs in again.
        That is the intended cost, and it is far smaller than an attacker
        holding a credential they can renew indefinitely.


        A consequence worth designing around: two requests racing with the same
        valid token have exactly one winner, and the loser is indistinguishable
        from a replay, so it is treated as one. A client refreshing from several
        tabs must serialise them.


        An unknown, expired or already-revoked token is 401 `TOKEN_INVALID`.
        That is a different code from the reuse case on purpose -- reuse means
        the session was taken away because a token was replayed, which is worth
        telling the learner and worth finding in a log, while `TOKEN_INVALID`
        means only that this credential buys nothing. Both end at the login
        form.


        A session that has reached its **absolute** expiry answers 401
        `SESSION_ABSOLUTE_EXPIRED`, and it is worth a code of its own because
        nothing is wrong: the learner did nothing, the token was not stolen, and
        the session simply reached the age at which possession has to be proven
        again. A client can say so rather than implying something went missing.
        Rotation moves the idle window forward on every use and never moves
        this, which is the entire security argument for the idle window being as
        long as it is (BR-AUTH-22).
      security: []
      responses:
        '200':
          description: >-
            Rotated. The old token is now spent and the cookie has been
            replaced.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Set-Cookie:
              $ref: '#/components/headers/Set-Cookie-Refresh'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
              example: *authSessionExample
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/oauth/google/start:
    get:
      tags: [auth]
      operationId: authGoogleStart
      summary: Begin Google sign-in.
      description: >-
        Generates the `state`, the `nonce` and the PKCE challenge, stores them
        server-side for ten minutes as a single-use record, and returns the
        authorization URL to send the browser to.


        The `state` is server-side and single use, and that is the CSRF defence
        for the whole flow (BR-AUTH-17): a callback carrying a `state` this
        server did not issue, or one it has already consumed, is not a callback
        from a flow this learner started. None of the three values is returned
        to the client, because a value the page can read is one an attacker who
        can read the same page can replay.


        PKCE is mandatory even though Fluentra is a confidential client holding
        a secret. It costs nothing, and it closes code interception on mobile
        browsers, which holding a secret does not.
      security: []
      parameters:
        - name: redirect_to
          in: query
          required: false
          description: >-
            Where to send the learner after signing in. Stored with the state
            rather than round-tripped through Google, so it cannot be rewritten
            in flight into an open redirect.
          schema:
            type: string
            maxLength: 512
      responses:
        '200':
          description: The authorization URL to send the browser to.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthStart'
              example:
                authorization_url: https://accounts.google.com/o/oauth2/v2/auth?client_id=example&state=example
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/oauth/google/callback:
    post:
      tags: [auth]
      operationId: authGoogleCallback
      summary: Complete Google sign-in.
      description: >-
        Consumes the `state`, exchanges the code with the PKCE verifier, and
        verifies Google's ID token against its JWKS -- signature, `iss`, `aud`,
        `exp`, and the `nonce` this server issued. A token failing any of those
        is rejected and **no account, identity or session is created**: there is
        no partial state to clean up, because nothing is written until every
        check has passed (BR-AUTH-18).


        Then one of five branches, and the third is the one this operation
        exists to get right (ADR-0023):


        1. **The identity is already linked** -- sign in.

        2. **The email matches a verified local account** -- link, then sign in.

        3. **The email matches an account that is not yet verified** -- refuse
        with 409 `OAUTH_ACCOUNT_CONFLICT`. **No link is created.** Anyone can
        register an address they do not own; the address is not proved until an
        OTP is completed on it. Auto-linking here would let whoever registered
        first be handed the account the real owner later signs into with Google,
        which is the account-takeover path this refusal exists to close
        (BR-AUTH-16). The learner completes the OTP challenge on that address
        and tries again.

        4. **No local account** -- create one, already verified, because Google
        has performed the verification (BR-AUTH-19).

        5. **Google did not assert `email_verified`** -- refuse with 403
        `OAUTH_EMAIL_UNVERIFIED` before any of the above is considered. An
        unverified address from a provider is worth no more than an unverified
        address from a form.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthCallbackRequest'
            example:
              code: 4/0AeanS0by-example-authorization-code
              state: 9f2c1a7e4b3d4c119d217f0a5c8e2b44
      responses:
        '200':
          description: The caller is signed in.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Set-Cookie:
              $ref: '#/components/headers/Set-Cookie-Refresh'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
              example: *authSessionExample
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/oauth/google/link:
    post:
      tags: [auth]
      operationId: authGoogleLink
      summary: Link a Google identity to the signed-in account.
      description: >-
        The same exchange and the same ID token checks as the callback, for a
        learner who is already signed in and adding a second way in.


        Two refusals are specific to this direction. `OAUTH_EMAIL_MISMATCH` (409)
        is a Google account whose address is not the one this account holds --
        linking those would let somebody attach an identity the account owner
        cannot receive mail at. `OAUTH_ALREADY_LINKED` (409) is an identity
        already attached to a different account; one Google account is one
        Fluentra account, or "sign in with Google" stops identifying anybody.
      x-permission: self
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthCallbackRequest'
            example:
              code: 4/0AeanS0by-example-authorization-code
              state: 9f2c1a7e4b3d4c119d217f0a5c8e2b44
      responses:
        '200':
          description: The identity is linked.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthIdentity'
              example:
                provider: google
                email: learner@example.com
                linked_at: '2026-08-12T09:12:44Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/oauth/google:
    delete:
      tags: [auth]
      operationId: authGoogleUnlink
      summary: Unlink Google.
      description: >-
        Removes the linked identity.


        **Refused with 409 `LAST_SIGN_IN_METHOD` if it would leave the account
        with no way in** (BR-AUTH-20). An account created through Google has no
        password, so unlinking it would lock the learner out of their own
        account with no recovery path -- `forgot-password` cannot help somebody
        who has no password to reset. They set one first, then unlink.


        Unlinking when nothing is linked answers 204, for the same reason the
        other idempotent operations do.
      x-permission: self
      responses:
        '204':
          description: No longer linked.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/forgot-password:
    post:
      tags: [auth]
      operationId: authForgotPassword
      summary: Start a password reset.
      description: >-
        Issues a `password_reset` challenge and emails the six-digit code to the
        address, if there is an account on it.


        **This operation always answers 202** (BR-AUTH-26), with the same body
        shape, whether or not the address is registered -- and it takes
        comparable time either way, because an unknown address still has a real
        challenge issued against it that nobody will ever receive a code for.
        Anything else here is an account-enumeration oracle: "we sent you an
        email" versus "no such account" is exactly the question an attacker with
        a list of addresses is asking.


        The response carries the challenge handle and not the code. The handle
        goes to the browser that asked and the code goes to the inbox, so
        neither party alone can complete the reset (BR-AUTH-11).


        Asking again invalidates the previous code. A learner who requests twice
        because the first email was slow must use the second code, which is what
        stops an old message in an inbox staying usable.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
            example:
              email: learner@example.com
      responses:
        '202':
          description: >-
            A challenge was issued. This is also the response for an address
            with no account -- deliberately indistinguishable.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Challenge'
              example:
                challenge_id: 0199a1c2-3d4e-7f80-9abc-def012345678
                purpose: password_reset
                expires_at: '2026-08-10T09:30:00Z'
                resend_after: '2026-08-10T09:01:00Z'
                attempts_remaining: 5
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/reset-password:
    post:
      tags: [auth]
      operationId: authResetPassword
      summary: Set a new password with a reset code.
      description: >-
        Consumes the challenge and replaces the password.


        **Every session is revoked**, on every device (BR-AUTH-05). A reset is
        what a learner reaches for when they think somebody else is in their
        account, so leaving that somebody signed in would defeat the operation
        they just performed. The response says how many devices went.


        The code is single-use and the challenge is burned after five wrong
        attempts. The reset window is thirty minutes rather than the ten a
        signup code gets: a reset email can sit unread through a meeting in a
        way a code typed on the next screen does not.


        This does not sign the caller in. They have just chosen a password and
        are asked to use it once, which costs a learner one screen and costs
        somebody who reset an account they do not own the same password they
        would need anyway.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
            example:
              challenge_id: 0199a1c2-3d4e-7f80-9abc-def012345678
              code: '482913'
              password: a perfectly fine passphrase
      responses:
        '200':
          description: The password was replaced and every session revoked.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordChanged'
              example: &passwordChangedExample
                changed_at: '2026-08-10T09:12:44Z'
                sessions_revoked: 3
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/change-password:
    post:
      tags: [auth]
      operationId: authChangePassword
      summary: Change the password while signed in.
      description: >-
        Replaces the password for the signed-in caller, who must present the
        current one as well as the new one.


        Requiring the current password is not redundant with the access token.
        The token proves the session was opened by somebody who knew the
        password; it does not prove the person holding it now does. Without the
        check, a token taken from an unlocked laptop is enough to lock its owner
        out of their own account.


        **Every other session is revoked and this one is kept** (BR-AUTH-05).
        Signing the learner out of the device they are standing at, immediately
        after they did the responsible thing, teaches them not to do it again.
        The response says how many other devices went.
      x-permission: self
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
            example:
              current_password: a-secret-password
              new_password: a perfectly fine passphrase
      responses:
        '200':
          description: The password was replaced and every other session revoked.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordChanged'
              example: *passwordChangedExample
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/devices:
    get:
      tags: [auth]
      operationId: authListDevices
      summary: List the devices this account has chosen to trust.
      description: >-
        Returns the caller's trusted devices, most recently active first, with
        both expiries: the idle one that every use moves forward, and the
        absolute one that nothing does.


        Showing both is the point. "Stay signed in" is only defensible because
        it ends -- a learner who can see that this laptop stops being trusted on
        a fixed date can reason about the risk, and one who cannot is being
        asked to take it on faith.
      x-permission: self
      responses:
        '200':
          description: The caller's trusted devices.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustedDeviceList'
              example:
                devices:
                  - id: 0199a1c2-3d4e-7f80-9abc-def012345678
                    label: Chrome on macOS
                    trusted_at: '2026-06-14T08:02:11Z'
                    last_seen_at: '2026-08-11T08:55:13Z'
                    idle_expires_at: '2026-11-09T08:55:13Z'
                    absolute_expires_at: '2026-12-11T08:02:11Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/devices/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The device to untrust, from the list operation.
        schema:
          type: string
          format: uuid
    delete:
      tags: [auth]
      operationId: authUntrustDevice
      summary: Stop trusting a device.
      description: >-
        Removes the trust and **revokes the refresh family belonging to it
        immediately**, so the device is signed out rather than merely demoted to
        the shorter window. Untrusting is what a learner reaches for when a
        laptop is lost, and a laptop that stays signed in for thirty more days
        is not what they asked for.


        A device belonging to another account is 404, not 403, for the reason
        `DELETE /auth/sessions/{id}` gives: 403 confirms the id names a real
        device and turns the operation into a way to enumerate them.


        Untrusting a device that is already untrusted answers 204.
      x-permission: self
      responses:
        '204':
          description: >-
            No longer trusted, and its refresh family revoked. Carries a cleared
            refresh cookie when the device untrusted was the caller's own.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Set-Cookie:
              $ref: '#/components/headers/Set-Cookie-RefreshCleared'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/logout:
    post:
      tags: [auth]
      operationId: authLogout
      summary: Sign out of this device.
      description: >-
        Revokes the session the access token names, revokes its refresh family,
        and clears the refresh cookie.


        The access token itself is added to a denylist so it stops working
        immediately rather than at its own expiry. That denylist is the one
        thing on the authentication path that reads a datastore, and it fails
        open (ADR-0007): if it cannot be reached, the token keeps working until
        it expires, which is at most fifteen minutes. Failing closed would turn
        a cache outage into a total authentication outage for every signed-in
        learner, which is the larger harm.


        Logging out twice is not an error. The second call finds nothing left to
        revoke and answers 204 all the same -- a client retrying after a dropped
        connection should not be told something went wrong.
      x-permission: self
      responses:
        '204':
          description: Signed out.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Set-Cookie:
              $ref: '#/components/headers/Set-Cookie-RefreshCleared'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/sessions:
    get:
      tags: [auth]
      operationId: authListSessions
      summary: List the devices this account is signed in on.
      description: >-
        Returns the caller's own live sessions, most recently active first.
        There is no path parameter and no filter by account: the actor comes
        from the token, so one learner cannot read another's list by changing a
        segment.


        No IP address appears here and none is stored -- see `SessionSummary`.
      x-permission: self
      responses:
        '200':
          description: The caller's live sessions.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionList'
              example:
                sessions:
                  - id: 0199a1c2-3d4e-7f80-9abc-def012345678
                    current: true
                    device_label: Chrome on macOS
                    created_at: '2026-08-09T04:21:07Z'
                    last_seen_at: '2026-08-11T08:55:13Z'
                  - id: 0199a1c2-3d4e-7f80-9abc-def0123456ab
                    current: false
                    device_label: null
                    created_at: '2026-07-28T19:02:44Z'
                    last_seen_at: '2026-08-10T21:14:02Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/sessions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The session to revoke, from the list operation.
        schema:
          type: string
          format: uuid
    delete:
      tags: [auth]
      operationId: authRevokeSession
      summary: Sign out of one device.
      description: >-
        Revokes the session and its refresh family, so the device it belongs to
        cannot renew and is signed out within one access-token lifetime.


        **A session belonging to another account is 404, not 403.** The two are
        not interchangeable: 403 confirms the id names a real session and turns
        this operation into an oracle for enumerating them, while 404 says only
        that the caller has no such session -- which is all they are entitled to
        know, and is equally true of an id that never existed.


        Revoking the current session is allowed and signs the caller out here:
        the response clears the refresh cookie in that case, and in that case
        only. `current` in the list operation is what lets an interface warn
        first.


        Revoking an already-revoked session answers 204, for the same reason
        logout is idempotent.
      x-permission: self
      responses:
        '204':
          description: >-
            Revoked. Carries a cleared refresh cookie when the session revoked
            was the caller's own.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Set-Cookie:
              $ref: '#/components/headers/Set-Cookie-RefreshCleared'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /me:
    get:
      tags: [user]
      operationId: userGetMe
      summary: Read the caller's own account.
      description: >-
        Returns the account belonging to the access token. There is deliberately
        no `/users/{id}` counterpart in this version: the actor comes from the
        token, so one user cannot read another by changing a path segment.
      x-permission: self
      responses:
        '200':
          description: The caller's account.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              example: &meExample
                id: 0199a1c2-3d4e-7f80-9abc-def012345678
                email: learner@example.com
                status: active
                email_verified_at: '2026-08-09T04:21:07Z'
                created_at: '2026-08-01T09:15:00Z'
                updated_at: '2026-08-09T04:21:07Z'
                profile:
                  display_name: Nghi
                  avatar_url: null
                  country: VN
                  timezone: Asia/Ho_Chi_Minh
                  date_of_birth: '1998-03-04'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [user]
      operationId: userUpdateMe
      summary: Update the caller's own profile.
      description: >-
        Partially updates the profile. Omitted fields are left alone; unknown
        and null fields are rejected with 422.
      x-permission: self
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
            example:
              display_name: Nghi Nguyen
              timezone: Asia/Ho_Chi_Minh
      responses:
        '200':
          description: The updated account.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              example: *meExample
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      tags: [user]
      operationId: userRequestDeletion
      summary: Request account deletion (GDPR Article 17).
      description: >-
        Initiates the 30-day grace period for account deletion. Revokes all
        active sessions immediately.
      x-permission: self
      responses:
        '202':
          description: Deletion requested and scheduled.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionResponse'
              example:
                id: 0199a1c2-3d4e-7f80-9abc-def012345678
                user_id: 0199a1c2-3d4e-7f80-9abc-def012345678
                status: pending
                requested_at: '2026-08-16T10:00:00Z'
                execute_at: '2026-09-15T10:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /me/permissions:
    get:
      tags: [rbac]
      operationId: rbacGetMyPermissions
      summary: Read the caller's own effective permissions.
      description: >-
        Resolves the caller's roles to the flat set of named permissions they
        grant. Advisory only: it exists so the interface can hide actions that
        would fail, and every server call re-checks regardless of what the
        client believes.
      x-permission: self
      responses:
        '200':
          description: The caller's roles and permissions.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyPermissions'
              example:
                roles: [user]
                permissions: []
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/preferences:
    get:
      tags: [user]
      operationId: userGetMyPreferences
      summary: Read the caller's preferences.
      description: >-
        Returns the full preference set. Every account has one from
        registration onwards, so this never returns an empty body.
      x-permission: self
      responses:
        '200':
          description: The caller's preferences.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
              example: &preferencesExample
                locale: vi
                theme: dark
                daily_goal_minutes: 30
                notification_channels: [in_app, push]
                quiet_hours:
                  start: '22:00'
                  end: '07:00'
                ai_processing_opt_out: false
                updated_at: '2026-08-09T04:21:07Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [user]
      operationId: userReplaceMyPreferences
      summary: Replace the caller's preferences.
      description: >-
        Replaces the whole preference set. A field left out is not "unchanged",
        it is a validation failure -- which is what makes this idempotent.
      x-permission: self
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplacePreferencesRequest'
            example:
              locale: vi
              theme: dark
              daily_goal_minutes: 30
              notification_channels: [in_app, push]
              quiet_hours:
                start: '22:00'
                end: '07:00'
              ai_processing_opt_out: false
      responses:
        '200':
          description: The stored preferences.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
              example: *preferencesExample
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /me/avatar/upload-intent:
    post:
      tags: [user]
      operationId: userRequestAvatarUploadIntent
      summary: Request a presigned URL to upload a profile avatar.
      description: >-
        Issues a presigned upload policy for an avatar image (JPEG, PNG, or
        WebP; max 5 MB).
      x-permission: self
      responses:
        '200':
          description: Upload intent generated.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvatarUploadIntent'
              example:
                upload_url: https://storage.example.com/fluentra-avatars/users/0199a1c2-3d4e-7f80-9abc-def012345678/2026/08/avatar-raw.jpg
                method: POST
                object_key: users/0199a1c2-3d4e-7f80-9abc-def012345678/2026/08/avatar-raw.jpg
                expires_at: '2026-08-15T08:05:00Z'
                max_bytes: 5242880
                content_type: image/jpeg
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /me/avatar:
    put:
      tags: [user]
      operationId: userConfirmAvatar
      summary: Confirm and process an uploaded avatar.
      description: >-
        Verifies the uploaded raw image, strips EXIF metadata, generates
        optimised variants, updates the caller's profile, and deletes the
        previous avatar.
      x-permission: self
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmAvatarRequest'
            example:
              object_key: users/0199a1c2-3d4e-7f80-9abc-def012345678/2026/08/avatar-raw.jpg
      responses:
        '200':
          description: The updated account with the new avatar.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              example: *meExample
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /me/export:
    post:
      tags: [user]
      operationId: userRequestExport
      summary: Request a complete export of all personal data (GDPR).
      description: >-
        Starts an asynchronous background job to collect the user's data across all modules,
        package it as a ZIP archive, and send a secure download link via email.
        If an export is already pending or processing, returns 409 Conflict.
      x-permission: self
      responses:
        '202':
          description: Data export request accepted and queued for processing.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportResponse'
              example:
                id: 0199a1c2-3d4e-7f80-9abc-def012345678
                user_id: 0199a1c2-3d4e-7f80-9abc-def012345678
                status: pending
                created_at: '2026-08-16T10:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /me/export/{id}:
    get:
      tags: [user]
      operationId: userGetExport
      summary: Get the status of a specific data export request.
      description: Returns the status and metadata for a previously requested data export.
      x-permission: self
      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier of the export request.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Current status and metadata of the export request.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportResponse'
              example:
                id: 0199a1c2-3d4e-7f80-9abc-def012345678
                user_id: 0199a1c2-3d4e-7f80-9abc-def012345678
                status: completed
                created_at: '2026-08-16T10:00:00Z'
                started_at: '2026-08-16T10:00:05Z'
                completed_at: '2026-08-16T10:00:15Z'
                expires_at: '2026-08-23T10:00:15Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /me/deletion/cancel:
    post:
      tags: [user]
      operationId: userCancelDeletion
      summary: Cancel a pending account deletion request.
      description: >-
        Cancels the active pending deletion request during the 30-day grace
        period and restores the account to active status.
      x-permission: self
      responses:
        '200':
          description: Deletion request successfully cancelled.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionResponse'
              example:
                id: 0199a1c2-3d4e-7f80-9abc-def012345678
                user_id: 0199a1c2-3d4e-7f80-9abc-def012345678
                status: cancelled
                requested_at: '2026-08-16T10:00:00Z'
                execute_at: '2026-09-15T10:00:00Z'
                cancelled_at: '2026-08-16T11:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /me/deletion/{id}:
    get:
      tags: [user]
      operationId: userGetDeletion
      summary: Get the status of an account deletion request.
      description: Returns the status and metadata for a previously requested account deletion.
      x-permission: self
      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier of the deletion request.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Current status and metadata of the deletion request.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionResponse'
              example:
                id: 0199a1c2-3d4e-7f80-9abc-def012345678
                user_id: 0199a1c2-3d4e-7f80-9abc-def012345678
                status: pending
                requested_at: '2026-08-16T10:00:00Z'
                execute_at: '2026-09-15T10:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/roles:
    get:
      tags: [rbac]
      operationId: rbacListRoles
      summary: List roles and the permissions they grant.
      description: >-
        The catalogue is small and fixed, so it is returned whole rather than
        paginated.
      x-permission: rbac.read
      responses:
        '200':
          description: Every role, with its permissions.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleList'
              example:
                items:
                  - name: admin
                    description: Full administrative access.
                    permissions: [rbac.assign, rbac.read, user.list]
                  - name: user
                    description: A learner. Holds no named permissions.
                    permissions: []
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/users/{id}/roles:
    parameters:
      - name: id
        in: path
        required: true
        description: The user whose roles are being changed.
        schema:
          type: string
          format: uuid
    post:
      tags: [rbac]
      operationId: rbacAssignRole
      summary: Grant a role to a user.
      description: >-
        Granting is idempotent: a role the user already holds is not an error.
        An actor cannot grant themselves a role they do not already hold.
      x-permission: rbac.assign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRoleRequest'
            example:
              role: admin
      responses:
        '200':
          description: The user's roles after the grant.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRoles'
              example: &userRolesExample
                user_id: 0199a1c2-3d4e-7f80-9abc-def012345678
                roles: [admin, user]
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /admin/users/{id}/roles/{role}:
    parameters:
      - name: id
        in: path
        required: true
        description: The user whose roles are being changed.
        schema:
          type: string
          format: uuid
      - name: role
        in: path
        required: true
        description: The role to revoke.
        schema:
          $ref: '#/components/schemas/RoleName'
    delete:
      tags: [rbac]
      operationId: rbacRevokeRole
      summary: Revoke a role from a user.
      description: >-
        Revoking is idempotent. Two revocations are refused: an actor removing
        their own `admin` role, and any revocation that would leave the system
        with no administrator.
      x-permission: rbac.assign
      responses:
        '200':
          description: The user's roles after the revocation.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRoles'
              example: *userRolesExample
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/audit-logs:
    get:
      tags: [audit]
      operationId: auditSearchLogs
      summary: Search the audit trail.
      description: >-
        Returns audit entries newest first, within a bounded time window.


        The window is mandatory in effect: `to` defaults to now and `from` to 90
        days before `to`. The table is partitioned by month on `created_at`, and
        a query with no bound on it reads every partition ever created — so the
        default is a bounded scan rather than an unbounded one that happens to
        be fast while the table is young.
      x-permission: audit.read
      parameters:
        - name: actor_id
          in: query
          required: false
          description: Only entries recorded against this actor.
          schema:
            type: string
            format: uuid
        - name: action
          in: query
          required: false
          description: Exact action name, such as `user.profile_updated`.
          schema:
            $ref: '#/components/schemas/AuditAction'
        - name: target_type
          in: query
          required: false
          description: Only entries whose target is of this kind.
          schema:
            type: string
            maxLength: 64
        - name: target_id
          in: query
          required: false
          description: >-
            Only entries against this target. Combined with `target_type` it is
            the "who touched this record" query.
          schema:
            type: string
            maxLength: 128
        - name: from
          in: query
          required: false
          description: Inclusive lower bound on `created_at`. Defaults to 90 days before `to`.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Exclusive upper bound on `created_at`. Defaults to now.
          schema:
            type: string
            format: date-time
        - name: cursor
          in: query
          required: false
          description: Opaque cursor from the previous page's `next_cursor`.
          schema:
            $ref: '#/components/schemas/Cursor'
        - name: limit
          in: query
          required: false
          description: Maximum entries to return.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: One page of audit entries.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogPage'
              example:
                items:
                  - id: 0199a1c2-3d4e-7f80-9abc-def012345678
                    created_at: '2026-08-10T09:15:00Z'
                    actor_id: 0199a1c2-3d4e-7f80-9abc-def012345679
                    actor_role: user
                    action: user.profile_updated
                    target_type: user
                    target_id: 0199a1c2-3d4e-7f80-9abc-def012345679
                    changed_fields: [display_name, timezone]
                    before: null
                    after: null
                    meta:
                      source: outbox
                    trace_id: 4bf92f3577b34da6a3ce929d0e0e4736
                page:
                  has_more: false
                  limit: 20
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /admin/security-events:
    get:
      tags: [audit]
      operationId: auditSearchSecurityEvents
      summary: Read the security event feed.
      description: >-
        Returns security events newest first, within the same bounded window as
        the audit trail and for the same reason. `resolved=false` is the triage
        queue.
      x-permission: audit.read
      parameters:
        - name: kind
          in: query
          required: false
          description: Exact event kind, such as `rbac.access_denied`.
          schema:
            type: string
            pattern: '^[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*$'
        - name: severity
          in: query
          required: false
          description: Only events at this severity.
          schema:
            $ref: '#/components/schemas/SecurityEventSeverity'
        - name: resolved
          in: query
          required: false
          description: >-
            `false` returns only open events, `true` only triaged ones. Omitted
            returns both.
          schema:
            type: boolean
        - name: user_id
          in: query
          required: false
          description: Only events involving this account.
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          required: false
          description: Inclusive lower bound on `created_at`. Defaults to 90 days before `to`.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Exclusive upper bound on `created_at`. Defaults to now.
          schema:
            type: string
            format: date-time
        - name: cursor
          in: query
          required: false
          description: Opaque cursor from the previous page's `next_cursor`.
          schema:
            $ref: '#/components/schemas/Cursor'
        - name: limit
          in: query
          required: false
          description: Maximum events to return.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: One page of security events.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityEventPage'
              example:
                items:
                  - id: 0199a1c2-3d4e-7f80-9abc-def01234567a
                    created_at: '2026-08-10T09:15:00Z'
                    kind: rbac.access_denied
                    severity: medium
                    user_id: 0199a1c2-3d4e-7f80-9abc-def012345679
                    detail:
                      permission: user.suspend
                    trace_id: 4bf92f3577b34da6a3ce929d0e0e4736
                    resolved_at: null
                    resolved_by: null
                    resolution_note: null
                page:
                  has_more: false
                  limit: 20
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /admin/security-events/{id}/resolve:
    parameters:
      - name: id
        in: path
        required: true
        description: The security event being triaged.
        schema:
          type: string
          format: uuid
    post:
      tags: [audit]
      operationId: auditResolveSecurityEvent
      summary: Mark a security event triaged.
      description: >-
        Records who closed the event and why. Resolving an already-resolved
        event is a conflict rather than a silent overwrite: the first
        explanation is the one that describes what was investigated.
      x-permission: audit.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveSecurityEventRequest'
            example:
              note: Known load test, permission denial expected.
      responses:
        '200':
          description: The resolved event.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityEvent'
              example:
                id: 0199a1c2-3d4e-7f80-9abc-def01234567a
                created_at: '2026-08-10T09:15:00Z'
                kind: rbac.access_denied
                severity: medium
                user_id: 0199a1c2-3d4e-7f80-9abc-def012345679
                detail:
                  permission: user.suspend
                trace_id: 4bf92f3577b34da6a3ce929d0e0e4736
                resolved_at: '2026-08-10T10:02:00Z'
                resolved_by: 0199a1c2-3d4e-7f80-9abc-def012345678
                resolution_note: Known load test, permission denial expected.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
