ReviewGrade:
  type: string
  enum: [again, hard, good, easy]
  description: FSRS recall evaluation grade.
  example: good

ReviewCard:
  type: object
  required: [id, user_id, content_version_id, skill, stability, difficulty, due_at, reps, lapses, state]
  properties:
    id:
      type: string
      format: uuid
    user_id:
      type: string
      format: uuid
    content_version_id:
      type: string
      format: uuid
    skill:
      type: string
      example: vocabulary
    stability:
      type: number
      format: double
      example: 2.45
    difficulty:
      type: number
      format: double
      example: 4.80
    due_at:
      type: string
      format: date-time
    reps:
      type: integer
      example: 3
    lapses:
      type: integer
      example: 0
    state:
      type: string
      enum: [new, learning, review, relearning]
      example: review
    suspended_at:
      type: string
      format: date-time
      nullable: true
    content:
      $ref: '#/ReviewCardContent'

# srs schedules a content version and knows nothing about what it holds. A card
# carrying only a schedule cannot be drawn as a flashcard, so the session resolves
# the version through the content contract and hands the body over as authored.
# It is absent — never a placeholder — when the version cannot be resolved.
ReviewCardContent:
  type: object
  required: [kind, body]
  properties:
    kind:
      type: string
      description: The activity kind, which decides how the client renders the body.
      example: vocab_flashcard
    cefr_level:
      type: string
      example: B2
    body:
      type: object
      additionalProperties: true
      description: The authored content body, exactly as the version stores it.
      example:
        word: meticulous
        pos: adjective
        ipa: /məˈtɪkjələs/
        definition: Showing great attention to detail.
        definition_vi: Tỉ mỉ, cẩn thận.
        example_sentence: She kept meticulous records of every transaction.

DueCountResponse:
  type: object
  required: [due_count]
  properties:
    due_count:
      type: integer
      example: 12

ReviewSessionResponse:
  type: object
  required: [cards]
  properties:
    cards:
      type: array
      items:
        $ref: '#/ReviewCard'
    total_due:
      type: integer
      example: 12

AnswerReviewRequest:
  type: object
  required: [grade]
  properties:
    grade:
      $ref: '#/ReviewGrade'
    elapsed_ms:
      type: integer
      minimum: 0
      example: 4200

AnswerReviewResponse:
  type: object
  required: [card, next_due_at, interval_days]
  properties:
    card:
      $ref: '#/ReviewCard'
    next_due_at:
      type: string
      format: date-time
    interval_days:
      type: integer
      example: 3

CompleteReviewSessionRequest:
  type: object
  properties:
    reviewed:
      type: integer
      minimum: 0
      example: 10
    correct:
      type: integer
      minimum: 0
      example: 8

CompleteReviewSessionResult:
  type: object
  required: [reviewed, correct, minutes, completed_at]
  properties:
    reviewed:
      type: integer
      example: 10
    correct:
      type: integer
      example: 8
    minutes:
      type: integer
      example: 5
    completed_at:
      type: string
      format: date-time

ForecastItem:
  type: object
  required: [date, due_count]
  properties:
    date:
      type: string
      format: date
      example: '2026-08-25'
    due_count:
      type: integer
      example: 15

ForecastResponse:
  type: object
  required: [days]
  properties:
    days:
      type: array
      items:
        $ref: '#/ForecastItem'
