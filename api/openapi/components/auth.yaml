RegisterRequest:
  type: object
  description: >-
    Everything needed to open an account. There is deliberately no `locale` or
    `timezone` beyond what is here: the rest of the profile is filled in after
    the learner is signed in, so that the registration form stays short.
  required: [email, password, display_name]
  additionalProperties: false
  properties:
    email:
      type: string
      format: email
      maxLength: 254
      description: >-
        Normalised to lower case and matched case-insensitively. Whether the
        address is already registered is never revealed by this operation.
      example: learner@example.com
    password:
      type: string
      minLength: 12
      maxLength: 128
      format: password
      description: >-
        At least 12 characters, not equal to the local part of the email, and
        not present in a public breach corpus. The corpus check fails open, so
        an outage at the breach service does not block registration.
      example: a perfectly fine passphrase
    display_name:
      type: string
      minLength: 1
      maxLength: 50
      description: >-
        Shown to other learners. Names that impersonate Fluentra staff are
        rejected.
      example: Nghi
    locale:
      type: string
      pattern: '^[a-z]{2}(-[A-Z]{2})?$'
      default: en
      description: Chooses the language the verification email is written in.
      example: vi
    timezone:
      type: string
      maxLength: 64
      default: UTC
      description: IANA timezone name.
      example: Asia/Ho_Chi_Minh

Challenge:
  type: object
  description: >-
    A pending one-time code. The code itself is never in this object, or in any
    response body: it goes to the email channel and nowhere else, which is what
    makes it prove control of the address.


    The `id` is the handle. A code is worthless without it, so an attacker who
    guesses six digits with no challenge id has guessed nothing.
  required: [challenge_id, purpose, expires_at, resend_after, attempts_remaining]
  additionalProperties: false
  properties:
    challenge_id:
      type: string
      format: uuid
      description: Identifies the challenge in the verify and resend operations.
    purpose:
      $ref: '#/ChallengePurpose'
    expires_at:
      type: string
      format: date-time
      description: >-
        Absolute expiry, ten minutes from issuance. A resend replaces the code
        but never moves this.
    resend_after:
      type: string
      format: date-time
      description: The earliest time a resend will be accepted.
    attempts_remaining:
      type: integer
      minimum: 0
      maximum: 10
      description: >-
        Verification attempts left before the challenge is burned permanently.
      example: 5

ChallengePurpose:
  type: string
  enum: [verify_email, login_otp, password_reset, link_oauth]
  description: >-
    What a challenge proves. One subsystem serves all four; only
    `verify_email` is reachable in this version of the API.

VerifyChallengeRequest:
  type: object
  required: [code]
  additionalProperties: false
  properties:
    code:
      type: string
      pattern: '^[0-9]{6}$'
      description: The six digits from the email.
      example: '482913'

VerifiedChallenge:
  type: object
  description: >-
    The outcome of a successful verification. It signs the learner in: proving
    the address is the last step of registration, not the second to last.


    The response also carries the first refresh cookie, so a learner who has
    just verified an address stays signed in without ever seeing the login
    form they would otherwise be sent to fifteen minutes later.
  required: [purpose, verified_at, session]
  additionalProperties: false
  properties:
    purpose:
      $ref: '#/ChallengePurpose'
    verified_at:
      type: string
      format: date-time
      description: The timestamp at which the address was marked verified.
    session:
      $ref: '#/AuthSession'

AuthSession:
  type: object
  description: >-
    A signed-in session. Returned by every operation that authenticates a
    caller, so a client has one shape to handle.


    **The access token belongs in memory only.** Never `localStorage`, never a
    cookie a script can read: it is a bearer credential, and anything that can
    read it can act as the learner until it expires.


    Every response carrying this object is also accompanied by a `Set-Cookie`
    holding the refresh token. There is no field for it here, and that is the
    point: a refresh token the page can read is a refresh token an injected
    script can steal, so it exists only as an `HttpOnly` cookie the browser
    replays to `POST /auth/refresh` and to nothing else.
  required: [access_token, token_type, expires_in, user_id, role]
  additionalProperties: false
  properties:
    access_token:
      type: string
      description: >-
        A short-lived signed token, presented as `Authorization: Bearer <token>`.
        It carries the account id, the session id, the role and its own id --
        and no personal data at all, so a leaked token reveals nothing about
        the learner beyond an opaque identifier.
      # An obvious placeholder, not a realistic token. A high-entropy example
      # trips secret scanners on every repository that vendors this spec.
      example: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJleGFtcGxlIn0.example-signature # gitleaks:allow
    token_type:
      type: string
      enum: [Bearer]
      description: Always `Bearer`. Present so a client can build the header generically.
    expires_in:
      type: integer
      minimum: 1
      description: >-
        Seconds until the access token expires. A client should refresh well
        before this, not after a rejected request.
      example: 900
    user_id:
      type: string
      format: uuid
      description: The account that was signed in.
    role:
      type: string
      enum: [admin, user]
      description: >-
        Advisory only, so the interface can hide actions that would fail. Every
        server operation re-checks regardless of what the client believes.

LoginRequest:
  type: object
  required: [email, password]
  additionalProperties: false
  properties:
    email:
      type: string
      format: email
      maxLength: 254
      example: learner@example.com
    password:
      type: string
      format: password
      example: a-secret-password
    remember_device:
      type: boolean
      default: false
    device_id:
      type: string
      maxLength: 128

SessionSummary:
  type: object
  description: >-
    One signed-in device, as its owner sees it in the "where am I signed in"
    list.


    There is no IP address here and none is stored. The session row keeps a
    keyed digest of the address, which answers "is this the same origin as last
    time" without the table becoming a movement log for every learner. The
    country the address resolves to is a separate matter and is not here yet:
    it has to be worked out at sign-in, while the address is still in hand, and
    the local database that does that arrives with its own change.
  required: [id, current, created_at, last_seen_at]
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
      description: Identifies the session in the revoke operation.
    current:
      type: boolean
      description: >-
        Whether this is the session making the request. Revoking it signs the
        caller out here and now, which is worth warning about before it happens
        rather than explaining afterwards.
    device_label:
      type: [string, 'null']
      maxLength: 80
      description: >-
        A coarse description derived from the user agent -- "Chrome on macOS",
        not a fingerprint. Null when the session was opened by a path that had
        no user agent to read, and for sessions that predate labelling.
      example: Chrome on macOS
    created_at:
      type: string
      format: date-time
      description: When the learner signed in on this device.
    last_seen_at:
      type: string
      format: date-time
      description: >-
        The last time this session refreshed a token. It moves on refresh, not
        on every request, so it is accurate to within one access-token lifetime.

SessionList:
  type: object
  description: >-
    Every session that is still live, newest activity first. Revoked and expired
    sessions are not listed: the question this answers is "where am I signed in
    now", and a list that also showed places the learner is no longer signed in
    would make the answer harder to read, not more complete.
  required: [sessions]
  additionalProperties: false
  properties:
    sessions:
      type: array
      maxItems: 200
      items:
        $ref: '#/SessionSummary'
