AdminUserSummary:
  type: object
  description: >-
    A user as it appears in an administrative search result. Deliberately
    thinner than `AdminUserDetail`: a list screen shows many rows at once, and
    reading a row is not audited, so it carries only what the row renders.
  required: [id, email, display_name, status, created_at]
  properties:
    id:
      type: string
      format: uuid
    email:
      type: string
      format: email
      description: >-
        Visible here because `user.list` is an administrative permission. The
        learner-facing search operations never return an address.
      example: learner@example.com
    display_name:
      type: string
      example: Nghi
    avatar_url:
      type: [string, 'null']
      format: uri
      description: Public avatar URL, or null when none has been uploaded.
    status:
      $ref: ./user.yaml#/UserStatus
    created_at:
      type: string
      format: date-time

AdminUserPage:
  type: object
  description: >-
    One page of search results. Cursor-paginated rather than offset-paginated
    because the underlying set changes while an administrator pages through it.
  required: [items, total]
  properties:
    items:
      type: array
      items:
        $ref: '#/AdminUserSummary'
    total:
      type: integer
      description: >-
        How many accounts match the filters, across every page. The page itself
        cannot say this — `items.length` is the size of one page, and a footer
        reading "15 learners" while thousands matched is the reason this exists.
      example: 1284
    next_cursor:
      type: string
      description: >-
        Opaque cursor for the following page. Absent on the last page — its
        absence, not an empty `items`, is what ends the walk.

AdminUserDetail:
  type: object
  description: >-
    The full profile an administrator sees on one user. Reading this is
    recorded as `admin.user_viewed`, which is why it is a separate operation
    from the search rather than a wider search row.
  required: [id, email, display_name, locale, timezone, status, created_at, updated_at]
  properties:
    id:
      type: string
      format: uuid
    email:
      type: string
      format: email
      example: learner@example.com
    display_name:
      type: string
      example: Nghi
    avatar_url:
      type: [string, 'null']
      format: uri
    locale:
      type: string
      description: IETF language tag the learner reads the product in.
      example: vi-VN
    timezone:
      type: string
      description: IANA timezone name. Every timestamp in the API stays UTC.
      example: Asia/Ho_Chi_Minh
    status:
      $ref: ./user.yaml#/UserStatus
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

AdminActionRequest:
  type: object
  description: >-
    The reason an administrative action was taken. Required on every operation
    that changes another account's state: the reason is written to the admin
    action log alongside the actor, and a log entry without one would not
    answer the question the log exists to answer.
  required: [reason]
  properties:
    reason:
      type: string
      minLength: 10
      description: >-
        Free text, at least 10 characters. Trimmed before the length is
        checked, so whitespace does not satisfy it.
      example: Repeated spam reports confirmed by moderation review.

AdminUserStatusChanged:
  type: object
  description: The user's new lifecycle state after a suspend or reinstate.
  required: [id, status]
  properties:
    id:
      type: string
      format: uuid
    status:
      $ref: ./user.yaml#/UserStatus

AdminSessionsRevoked:
  type: object
  description: Acknowledges that every active session for the user was ended.
  required: [id, revoked]
  properties:
    id:
      type: string
      format: uuid
    revoked:
      type: boolean
      description: >-
        Always true on success. The count is deliberately not returned — it
        leaks how many devices a user is signed in on, and the operation is
        idempotent, so zero and many are the same outcome.

FeatureFlag:
  type: object
  description: >-
    A feature flag and its rollout. Evaluation buckets a user by a stable hash
    of the flag key and the user id, so a given user stays on the same side of
    a partial rollout across requests.
  required:
    [key, enabled, rollout_percent, owner, expires_on, description, created_at, updated_at]
  properties:
    key:
      type: string
      description: Stable identifier the code checks. Never reused after deletion.
      example: streaks_v2
    enabled:
      type: boolean
      description: >-
        The master switch. A disabled flag is off for everybody regardless of
        `rollout_percent`.
    rollout_percent:
      type: integer
      minimum: 0
      maximum: 100
      description: Share of users the flag is on for while `enabled` is true.
      example: 25
    owner:
      type: string
      description: >-
        Who is accountable for removing this flag. Required so that an expired
        flag has somebody to chase.
      example: '@backend-team'
    expires_on:
      type: string
      format: date
      description: >-
        The date this flag is expected to be gone. Flags are meant to be
        temporary; this is what makes an abandoned one visible.
      example: '2026-12-31'
    description:
      type: string
      description: What the flag controls, in a sentence.
      example: Second-generation streak calculation.
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

FeatureFlagList:
  type: object
  description: >-
    Every flag, unpaginated. The set is small and an administrator needs to see
    all of it to spot the expired ones.
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: '#/FeatureFlag'

CreateFeatureFlagRequest:
  type: object
  required: [key, owner, expires_on, description]
  properties:
    key:
      type: string
      minLength: 1
      example: streaks_v2
    enabled:
      type: boolean
      default: false
    rollout_percent:
      type: integer
      minimum: 0
      maximum: 100
      default: 0
    owner:
      type: string
      minLength: 1
      example: '@backend-team'
    expires_on:
      type: string
      format: date
      description: Must be in the future.
      example: '2026-12-31'
    description:
      type: string
      minLength: 1
      example: Second-generation streak calculation.

UpdateFeatureFlagRequest:
  type: object
  description: >-
    A full replacement of the mutable fields. `key` and `owner` are not here:
    changing either would make the flag a different flag, and the audit trail
    reads better when that is a delete and a create.
  required: [expires_on, description]
  properties:
    enabled:
      type: boolean
    rollout_percent:
      type: integer
      minimum: 0
      maximum: 100
    expires_on:
      type: string
      format: date
      example: '2026-12-31'
    description:
      type: string
      minLength: 1
      example: Second-generation streak calculation.

AdminAIUsageResponse:
  type: object
  description: >-
    Current AI provider usage and budget status for today.
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: '#/AdminAIUsageItem'

AdminAIUsageItem:
  type: object
  description: >-
    Usage and budget status for a specific provider and task pair.
  required: [provider, task, requests_today, tokens_today, is_exhausted]
  properties:
    provider:
      type: string
      example: openai_compatible
    task:
      type: string
      example: vocab_verify
    requests_today:
      type: integer
      example: 45
    tokens_today:
      type: integer
      example: 12050
    daily_request_limit:
      type: [integer, 'null']
      description: Configured daily request limit, or null if unconstrained.
      example: 1000
    daily_token_limit:
      type: [integer, 'null']
      description: Configured daily token limit, or null if unconstrained.
      example: 500000
    is_exhausted:
      type: boolean
      description: True if today's usage has reached or exceeded any configured limit.
      example: false

BannerTone:
  type: string
  description: >-
    How the banner is coloured. `info` for neutral news, `success` for good
    news, `warning` for something a learner must act on, `promo` for an offer.
  enum: [info, success, warning, promo]
  example: promo

BannerKind:
  type: string
  description: >-
    How the banner is shown. `announcement` is a message shown once as a
    dialog on the dashboard: closing a dismissible one hides it for good, a
    non-dismissible one comes back on the next visit. `slide` is an
    image-only promotion in the dashboard carousel: it needs an image, has no
    body, button text or dismissal, and its optional `cta_url` makes the whole
    picture a link.
  enum: [announcement, slide]
  example: announcement

Banner:
  type: object
  description: >-
    A banner as an administrator manages it. It shows on the learner
    dashboard while `is_active` is true and the current time is inside the
    optional `starts_at`..`ends_at` window. `title`, `body` and `cta_label`
    are plain text, never HTML.
  required:
    [id, kind, title, body, cta_label, cta_url, tone, is_active, priority,
     dismissible, starts_at, ends_at, created_by, created_at, updated_at]
  properties:
    id:
      type: string
      format: uuid
    kind:
      $ref: '#/BannerKind'
    title:
      type: string
      minLength: 1
      maxLength: 120
      example: IELTS mock week
    body:
      type: string
      maxLength: 500
      description: Supporting text; may be empty.
      example: Take a full mock test free until Sunday.
    cta_label:
      type: [string, 'null']
      maxLength: 40
      description: Call-to-action text. On an announcement, present exactly when `cta_url` is; always null on a slide.
      example: Start a mock test
    cta_url:
      type: [string, 'null']
      maxLength: 2048
      description: >-
        Where the call to action leads: an internal path starting with `/`
        (never `//`) or an `https://` URL.
      example: /exams
    tone:
      $ref: '#/BannerTone'
    is_active:
      type: boolean
      description: The master switch. An inactive banner never shows.
    priority:
      type: integer
      minimum: 0
      maximum: 1000
      description: Higher shows first.
      example: 10
    dismissible:
      type: boolean
      description: Whether a learner may hide it from their own dashboard.
    starts_at:
      type: [string, 'null']
      format: date-time
      description: Shown from this instant; null means from now.
    ends_at:
      type: [string, 'null']
      format: date-time
      description: Shown until this instant (exclusive); null means indefinitely.
    created_by:
      type: string
      format: uuid
      description: The administrator who created it.
    image_key:
      type: [string, 'null']
      description: >-
        Storage key of the banner's processed image, or null for a text-only
        banner. Set it from `POST /admin/banners/images`.
      example: banners/images/0199c3e4-5f60-7a82-9cde-f01234567899.jpg
    image_url:
      type: [string, 'null']
      format: uri
      description: A short-lived signed URL for the image; null without one.
    image_alt:
      type: string
      maxLength: 160
      description: Alternative text; empty marks the image as decorative.
      example: Learners taking a mock test
    image_width:
      type: [integer, 'null']
      description: Width in pixels of the processed image.
      example: 1600
    image_height:
      type: [integer, 'null']
      description: Height in pixels of the processed image.
      example: 900
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

BannerList:
  type: object
  description: Every banner, unpaginated and capped at 200.
  required: [items]
  properties:
    items:
      type: array
      maxItems: 200
      items:
        $ref: '#/Banner'

BannerRequest:
  type: object
  description: >-
    The editable fields of a banner, used for both create and full
    replacement. Unknown fields are refused. For a `slide`, `body`,
    `cta_label` and `dismissible` are ignored (stored empty, null and false),
    `image_key` is required, and an empty `image_alt` defaults to the title.
  required: [title]
  additionalProperties: false
  properties:
    kind:
      $ref: '#/BannerKind'
      default: announcement
    title:
      type: string
      minLength: 1
      maxLength: 120
      example: IELTS mock week
    body:
      type: string
      maxLength: 500
      default: ''
    cta_label:
      type: [string, 'null']
      maxLength: 40
      description: On an announcement, required when `cta_url` is set, and only then. Ignored on a slide.
    cta_url:
      type: [string, 'null']
      maxLength: 2048
      description: >-
        An internal path starting with `/` (not `//`) or an `https://` URL.
        `javascript:`, `data:`, `http:` and protocol-relative values are
        refused with 422.
    tone:
      $ref: '#/BannerTone'
    is_active:
      type: boolean
      default: false
    priority:
      type: integer
      minimum: 0
      maximum: 1000
      default: 0
    dismissible:
      type: boolean
      default: true
    starts_at:
      type: [string, 'null']
      format: date-time
    ends_at:
      type: [string, 'null']
      format: date-time
      description: Must be later than `starts_at` when both are set.
    image_key:
      type: [string, 'null']
      pattern: '^banners/images/[0-9a-f-]{36}[.]jpg$'
      description: >-
        A processed image returned by `POST /admin/banners/images`, or null
        for no image. Replacing or clearing it deletes the previous image.
    image_alt:
      type: string
      maxLength: 160
      default: ''
      description: Alternative text; leave empty when the image is decorative.

ActiveBanner:
  type: object
  description: >-
    A banner as a learner sees it. Plain text only; render `title`, `body` and
    `cta_label` as text, never as HTML. At most three announcements and six
    slides are listed, each kind highest priority first.
  required: [id, kind, title, body, cta_label, cta_url, tone, dismissible]
  properties:
    id:
      type: string
      format: uuid
    kind:
      $ref: '#/BannerKind'
    title:
      type: string
      example: IELTS mock week
    body:
      type: string
      example: Take a full mock test free until Sunday.
    cta_label:
      type: [string, 'null']
      example: Start a mock test
    cta_url:
      type: [string, 'null']
      example: /exams
    tone:
      $ref: '#/BannerTone'
    dismissible:
      type: boolean
    image_url:
      type: [string, 'null']
      format: uri
      description: A short-lived signed URL for the banner image; null without one.
    image_alt:
      type: string
      description: Alternative text; empty when the image is decorative.
    image_width:
      type: [integer, 'null']
      description: Lets the client reserve the image's space before it loads.
    image_height:
      type: [integer, 'null']

ActiveBannerList:
  type: object
  description: The banners showing now, at most three, in display order.
  required: [items]
  properties:
    items:
      type: array
      maxItems: 3
      items:
        $ref: '#/ActiveBanner'

BannerImageUploadIntentRequest:
  type: object
  additionalProperties: false
  required: [content_type]
  properties:
    content_type:
      type: string
      enum: [image/jpeg, image/png, image/webp]
      example: image/png

BannerImageUploadIntent:
  type: object
  description: >-
    A constrained browser upload for a banner image: the store itself enforces
    the content type and the size limit, and the bytes never pass through the
    API.
  required: [upload_url, method, object_key, expires_at, max_bytes, content_type]
  properties:
    upload_url:
      type: string
      format: uri
    method:
      type: string
      enum: [POST, PUT]
      example: POST
    form_data:
      type: object
      additionalProperties:
        type: string
      description: Form fields for a multipart POST policy upload.
    file_field:
      type: string
      example: file
    object_key:
      type: string
      example: banners/raw/0199c3e4-5f60-7a82-9cde-f01234567890/0199c3e4-5f60-7a82-9cde-f01234567899
    expires_at:
      type: string
      format: date-time
    max_bytes:
      type: integer
      format: int64
      example: 5242880
    content_type:
      type: string
      example: image/png

BannerImageRequest:
  type: object
  additionalProperties: false
  required: [object_key]
  properties:
    object_key:
      type: string
      description: The `object_key` of an upload intent whose upload finished.
      example: banners/raw/0199c3e4-5f60-7a82-9cde-f01234567890/0199c3e4-5f60-7a82-9cde-f01234567899

BannerImage:
  type: object
  description: >-
    A processed banner image: its bytes checked to be a real JPEG, PNG or
    WebP, oriented, scaled to fit 1600x900 and re-encoded as JPEG without
    metadata. Pass `image_key` in a BannerRequest to use it.
  required: [image_key, image_url, width, height]
  properties:
    image_key:
      type: string
      example: banners/images/0199c3e4-5f60-7a82-9cde-f01234567899.jpg
    image_url:
      type: string
      format: uri
      description: A short-lived signed URL, for the preview.
    width:
      type: integer
      example: 1600
    height:
      type: integer
      example: 900
