CourseSummary:
  type: object
  required: [id, slug, title, cefr_from, cefr_to, status, estimated_hours]
  properties:
    id:
      type: string
      format: uuid
    slug:
      type: string
      example: ielts-foundation
    title:
      type: string
      example: IELTS Foundation 5.0 - 6.5
    description:
      type: string
      example: Core skills and vocabulary for IELTS academic preparation.
    cefr_from:
      type: string
      example: B1
    cefr_to:
      type: string
      example: B2
    status:
      type: string
      enum: [draft, published, archived]
      example: published
    estimated_hours:
      type: integer
      example: 40

CourseList:
  type: object
  required: [courses]
  properties:
    courses:
      type: array
      items:
        $ref: '#/CourseSummary'

LessonActivity:
  type: object
  required: [id, lesson_id, position, kind, content_version_id, weight]
  properties:
    id:
      type: string
      format: uuid
    lesson_id:
      type: string
      format: uuid
    position:
      type: integer
      example: 1
    kind:
      type: string
      example: vocab_multiple_choice
    content_version_id:
      type: string
      format: uuid
    config:
      type: object
      description: Activity-specific configuration.
    weight:
      type: integer
      example: 10
    content:
      $ref: './content.yaml#/ContentVersion'

LessonSummary:
  type: object
  required: [id, unit_id, position, title, skill_focus, estimated_minutes, status, locked, completed]
  properties:
    id:
      type: string
      format: uuid
    unit_id:
      type: string
      format: uuid
    position:
      type: integer
      example: 1
    title:
      type: string
      example: Academic Word List - Topic 1
    skill_focus:
      type: string
      example: vocabulary
    estimated_minutes:
      type: integer
      example: 15
    status:
      type: string
      enum: [draft, published, archived]
      example: published
    locked:
      type: boolean
      example: false
    completed:
      type: boolean
      description: >-
        Whether this learner has finished the lesson. False for a signed-out
        visitor, who has no progress rather than unknown progress.
      example: true
    lock_reason:
      type: string
      nullable: true
      example: Complete Unit 1 Lesson 2 first

CourseUnit:
  type: object
  required: [id, course_id, position, title, lessons]
  properties:
    id:
      type: string
      format: uuid
    course_id:
      type: string
      format: uuid
    position:
      type: integer
      example: 1
    title:
      type: string
      example: Unit 1 - Everyday Campus Life
    description:
      type: string
      example: Vocabulary and functional grammar for university scenarios.
    lessons:
      type: array
      items:
        $ref: '#/LessonSummary'

CourseDetail:
  type: object
  required: [id, slug, title, cefr_from, cefr_to, status, estimated_hours, units]
  properties:
    id:
      type: string
      format: uuid
    slug:
      type: string
      example: ielts-foundation
    title:
      type: string
      example: IELTS Foundation 5.0 - 6.5
    description:
      type: string
      example: Comprehensive curriculum covering all 4 modules.
    cefr_from:
      type: string
      example: B1
    cefr_to:
      type: string
      example: B2
    status:
      type: string
      example: published
    estimated_hours:
      type: integer
      example: 40
    units:
      type: array
      items:
        $ref: '#/CourseUnit'

LessonDetail:
  type: object
  required: [id, unit_id, position, title, skill_focus, estimated_minutes, status, activities]
  properties:
    id:
      type: string
      format: uuid
    next_lesson_id:
      type: string
      format: uuid
      nullable: true
      description: >-
        The lesson that follows this one in the course, or null when this is the
        last one. Resolved on the server because the learner-facing route is
        `/learn/lesson/{id}` and carries no course: a client holding only a
        lesson id would have to fetch the whole catalogue to find what comes
        next, and would still get it wrong across a unit boundary.
    unit_id:
      type: string
      format: uuid
    position:
      type: integer
      example: 1
    title:
      type: string
      example: Academic Word List - Topic 1
    skill_focus:
      type: string
      example: vocabulary
    estimated_minutes:
      type: integer
      example: 15
    status:
      type: string
      example: published
    activities:
      type: array
      items:
        $ref: '#/LessonActivity'

CreateCourseRequest:
  type: object
  required: [slug, title, cefr_from, cefr_to, estimated_hours]
  properties:
    slug:
      type: string
      example: ielts-foundation
    title:
      type: string
      example: IELTS Foundation
    description:
      type: string
    cefr_from:
      type: string
      example: B1
    cefr_to:
      type: string
      example: B2
    estimated_hours:
      type: integer
      example: 40

# The bounds below are enforced in the domain as well as declared here: the
# handlers are hand-written, so an unenforced schema is a comment. `weight`
# feeds the int32 estimated_minutes column, which an unbounded integer overflows.
ActivityInput:
  type: object
  required: [position, kind, content_version_id, weight]
  properties:
    position:
      type: integer
      minimum: 1
      maximum: 100
    kind:
      type: string
      minLength: 1
      maxLength: 50
    content_version_id:
      type: string
      format: uuid
    config:
      type: object
    weight:
      type: integer
      minimum: 0
      maximum: 100

UpdateActivitiesRequest:
  type: object
  required: [activities]
  properties:
    activities:
      type: array
      minItems: 1
      maxItems: 100
      items:
        $ref: '#/ActivityInput'
