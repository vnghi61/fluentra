Enrollment:
  type: object
  required: [id, user_id, course_id, status, started_at]
  properties:
    id:
      type: string
      format: uuid
    user_id:
      type: string
      format: uuid
    course_id:
      type: string
      format: uuid
    status:
      type: string
      enum: [active, completed, paused]
      example: active
    started_at:
      type: string
      format: date-time
      example: '2026-08-24T09:00:00Z'
    completed_at:
      type: string
      format: date-time
      nullable: true
      example: null

SkillMastery:
  type: object
  required: [skill, level, confidence, updated_at]
  properties:
    skill:
      type: string
      enum: [vocabulary, grammar, reading, listening, speaking, writing]
      example: vocabulary
    level:
      type: string
      example: B1
    confidence:
      type: number
      format: float
      example: 0.85
    updated_at:
      type: string
      format: date-time
      example: '2026-08-24T09:00:00Z'

NextActivity:
  type: object
  required: [activity_id, lesson_id, unit_id, course_id, title, kind, skill]
  properties:
    activity_id:
      type: string
      format: uuid
    lesson_id:
      type: string
      format: uuid
    unit_id:
      type: string
      format: uuid
    course_id:
      type: string
      format: uuid
    title:
      type: string
      example: Academic Word List - Topic 1
    kind:
      type: string
      example: vocab_multiple_choice
    skill:
      type: string
      example: vocabulary
    estimated_minutes:
      type: integer
      example: 5

DashboardResponse:
  type: object
  required: [state, due_reviews_count, skill_mastery]
  properties:
    state:
      type: string
      enum: [not_started, in_progress, completed]
      description: Learner state indicating current progress level.
      example: in_progress
    next_activity:
      $ref: '#/NextActivity'
    due_reviews_count:
      type: integer
      description: Number of SRS review cards due today.
      example: 0
    skill_mastery:
      type: array
      items:
        $ref: '#/SkillMastery'

CourseProgress:
  type: object
  required: [course_id, status, completed_activities, total_activities, percentage]
  properties:
    course_id:
      type: string
      format: uuid
    status:
      type: string
      enum: [not_started, in_progress, completed]
      example: in_progress
    completed_activities:
      type: integer
      example: 12
    total_activities:
      type: integer
      example: 40
    percentage:
      type: integer
      example: 30
    score:
      type: integer
      nullable: true
      example: 88
    completed_at:
      type: string
      format: date-time
      nullable: true
      example: null

ProgressResponse:
  type: object
  required: [courses, skills]
  properties:
    courses:
      type: array
      items:
        $ref: '#/CourseProgress'
    skills:
      type: array
      items:
        $ref: '#/SkillMastery'

StartAttemptResult:
  type: object
  required: [attempt_id, activity_id, status, started_at]
  properties:
    attempt_id:
      type: string
      format: uuid
    activity_id:
      type: string
      format: uuid
    status:
      type: string
      enum: [in_progress]
      example: in_progress
    started_at:
      type: string
      format: date-time
      example: '2026-08-24T09:00:00Z'

SubmitAttemptRequest:
  type: object
  required: [response]
  properties:
    response:
      type: object
      description: Activity response payload (structure depends on activity kind).
      example:
        selected_option_id: 0199a1c2-3d4e-7f80-9abc-def01234567f

PreviewGradeResult:
  type: object
  required: [correct, score, max_score, feedback, saved]
  description: >-
    The outcome of grading that recorded nothing. There is no attempt id and no
    status, because nothing was created and nothing moved.
  properties:
    correct:
      type: boolean
      example: true
    score:
      type: integer
      example: 100
    max_score:
      type: integer
      example: 100
    feedback:
      type: string
      example: Correct! Well done.
    correct_answer:
      type: string
      description: >-
        What the learner should have said. The lesson body is redacted, so this
        is where the renderer learns the answer. For a choice-based activity it
        is the option's id.
      nullable: true
      example: opt_habit
    saved:
      type: boolean
      description: >-
        Always false. Stated rather than implied, so a client cannot mistake a
        preview for a recorded attempt.
      example: false
    explanation:
      $ref: '#/AnswerExplanation'
    item_results:
      type: array
      items:
        $ref: '#/ItemResult'

SubmitAttemptResult:
  type: object
  required: [attempt_id, status]
  properties:
    attempt_id:
      type: string
      format: uuid
    status:
      type: string
      enum: [graded, grading, failed]
      example: graded
    score:
      type: integer
      nullable: true
      example: 100
    max_score:
      type: integer
      nullable: true
      example: 100
    correct:
      type: boolean
      nullable: true
      example: true
    correct_answer:
      type: string
      description: >-
        What the learner should have said, revealed only now. The lesson body is
        redacted, so this is where the renderer learns the answer — after the
        submission, not before it. For a choice-based activity this is the
        option's id, which is what marks the right row.
      nullable: true
      example: opt_habit
    feedback:
      type: string
      nullable: true
      example: Correct! Well done.
    explanation:
      $ref: '#/AnswerExplanation'
    item_results:
      type: array
      items:
        $ref: '#/ItemResult'

ItemResult:
  type: object
  required: [id, correct]
  properties:
    id:
      type: string
      example: q1
    correct:
      type: boolean
      example: true
    correct_answer:
      type: string
      nullable: true
      example: opt_b
    explanation:
      $ref: '#/AnswerExplanation'

AnswerExplanation:
  type: object
  required: [text, text_vi]
  properties:
    text:
      type: string
      description: Explanation in English of the word's meaning, correct answer, and why.
      example: "'Leisure' means free time for enjoyment. Option A is correct because it directly refers to time spent away from work."
    text_vi:
      type: string
      description: Explanation in Vietnamese.
      example: "'Leisure' có nghĩa là thời gian rảnh rỗi để thư giãn. Đáp án A đúng vì nó trực tiếp chỉ thời gian không phải làm việc."

AttemptDetail:
  type: object
  required: [id, activity_id, user_id, status, started_at]
  properties:
    id:
      type: string
      format: uuid
    activity_id:
      type: string
      format: uuid
    user_id:
      type: string
      format: uuid
    status:
      type: string
      enum: [in_progress, grading, graded, failed]
      example: graded
    response:
      type: object
      nullable: true
      description: Submitted response payload.
    score:
      type: integer
      nullable: true
      example: 90
    max_score:
      type: integer
      nullable: true
      example: 100
    feedback:
      type: string
      nullable: true
      example: Good comprehension of the reading passage.
    duration_ms:
      type: integer
      nullable: true
      example: 45000
    started_at:
      type: string
      format: date-time
      example: '2026-08-24T09:00:00Z'
    completed_at:
      type: string
      format: date-time
      nullable: true
      example: '2026-08-24T09:01:00Z'

StartSessionRequest:
  type: object
  properties:
    metadata:
      type: object
      description: Optional client session context.

LearningSession:
  type: object
  required: [id, user_id, started_at, activities_completed, minutes]
  properties:
    id:
      type: string
      format: uuid
    user_id:
      type: string
      format: uuid
    started_at:
      type: string
      format: date-time
      example: '2026-08-24T09:00:00Z'
    ended_at:
      type: string
      format: date-time
      nullable: true
      example: null
    activities_completed:
      type: integer
      example: 0
    minutes:
      type: integer
      example: 0

CompleteSessionRequest:
  type: object
  properties:
    activities_completed:
      type: integer
      nullable: true
      example: 3

DailyPracticeSet:
  type: object
  required: [id, local_date, level, activities]
  properties:
    id:
      type: string
      format: uuid
    local_date:
      type: string
      format: date
      example: '2026-09-11'
    level:
      type: string
      example: 'B1'
    activities:
      type: array
      items:
        $ref: './lesson.yaml#/LessonActivity'

# Private practice generated from one of the learner's own uploads (WO 21
# Stage B). Never part of the shared bank and never visible to another learner.
ResourcePracticeSet:
  type: object
  required: [resource_id, status, generated_on, activities]
  properties:
    resource_id:
      type: string
      format: uuid
    status:
      type: string
      enum: [generating, ready, failed]
      example: ready
    failure_reason:
      type: string
      example: ''
    generated_on:
      type: string
      format: date
      example: '2026-09-22'
    activities:
      type: array
      description: Empty while generating; the ten items once ready.
      items:
        $ref: './lesson.yaml#/LessonActivity'


PlacementSkillEstimate:
  type: object
  description: One skill's placed band and how many scored responses it rests on.
  required: [band, responses]
  properties:
    band:
      type: string
      enum: [A1, A2, B1, B2, C1]
      example: B1
    responses:
      type: integer
      minimum: 0
      example: 7

PlacementResult:
  type: object
  description: >-
    A completed placement. per_skill holds vocabulary, grammar, reading and
    listening from the adaptive part; writing and speaking join it once graded.
    A skill with no responses is absent, never guessed.
  required: [id, level, per_skill, taken_at]
  properties:
    id:
      type: string
      format: uuid
    session_id:
      type: string
      format: uuid
    level:
      type: string
      enum: [A1, A2, B1, B2, C1]
      example: B1
    per_skill:
      type: object
      additionalProperties:
        $ref: '#/PlacementSkillEstimate'
    taken_at:
      type: string
      format: date-time

PlacementActiveSession:
  type: object
  required: [id, stage, deadline_at, remaining_seconds]
  properties:
    id:
      type: string
      format: uuid
    stage:
      type: string
      enum: [vocabulary_grammar, reading_listening, refine, done]
    deadline_at:
      type: string
      format: date-time
    remaining_seconds:
      type: integer
      minimum: 0

PlacementOverview:
  type: object
  required: [result, active_session, retake_available_at, invite_available]
  properties:
    result:
      description: The current placement result, the most recent one.
      anyOf:
        - $ref: '#/PlacementResult'
        - type: 'null'
    active_session:
      anyOf:
        - $ref: '#/PlacementActiveSession'
        - type: 'null'
    retake_available_at:
      type: [string, 'null']
      format: date-time
      description: 30 days after the last completed test.
    invite_available:
      type: boolean
      description: >-
        The flag placement.invite is on, and the learner has no result and no
        session in progress.

PlacementItem:
  type: object
  required: [activity_id, content_version_id, kind, skill, config]
  properties:
    activity_id:
      type: string
      format: uuid
    content_version_id:
      type: string
      format: uuid
    kind:
      type: string
      example: grammar_tense_choice
    skill:
      type: string
      enum: [vocabulary, grammar, reading, listening, writing, speaking]
    config:
      type: object
      additionalProperties: true
      description: The item's body with every answer removed (ADR-0025).

PlacementProductiveItem:
  allOf:
    - $ref: '#/PlacementItem'
    - type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [not_answered, grading, graded, failed]
        band:
          type: [string, 'null']
          enum: [A1, A2, B1, B2, C1, null]

PlacementSession:
  type: object
  required:
    - id
    - status
    - stage
    - started_at
    - deadline_at
    - remaining_seconds
    - responses
    - max_responses
    - current_item
    - productive_status
    - productive_deadline_at
    - productive_remaining_seconds
    - productive_items
    - result
  properties:
    id:
      type: string
      format: uuid
    status:
      type: string
      enum: [in_progress, completed, expired]
    stage:
      type: string
      enum: [vocabulary_grammar, reading_listening, refine, done]
    started_at:
      type: string
      format: date-time
    deadline_at:
      type: string
      format: date-time
    remaining_seconds:
      type: integer
      minimum: 0
      description: The server's clock. Zero once the adaptive part is over.
    responses:
      type: integer
      minimum: 0
    max_responses:
      type: integer
      example: 25
    current_item:
      description: The item to answer now, or null when the adaptive part is over.
      anyOf:
        - $ref: '#/PlacementItem'
        - type: 'null'
    productive_status:
      type: string
      enum: [offered, skipped, in_progress, submitted, graded]
    productive_deadline_at:
      type: [string, 'null']
      format: date-time
    productive_remaining_seconds:
      type: integer
      minimum: 0
    productive_items:
      type: array
      items:
        $ref: '#/PlacementProductiveItem'
    result:
      anyOf:
        - $ref: '#/PlacementResult'
        - type: 'null'

PlacementAnswerRequest:
  type: object
  required: [activity_id, response]
  properties:
    activity_id:
      type: string
      format: uuid
      description: The item being answered. Anything but the current item is refused.
    response:
      type: object
      additionalProperties: true
      description: What the kind's grader reads, as for POST /attempts/{id}/submit.

PlacementProductiveRequest:
  type: object
  required: [skip]
  properties:
    skip:
      type: boolean
      description: True skips writing and speaking; they can still be started later.

StartingPathLesson:
  type: object
  required: [id, title, cefr_level]
  properties:
    id:
      type: string
      format: uuid
    title:
      type: string
    cefr_level:
      type: [string, 'null']
      enum: [A1, A2, B1, B2, C1, C2, null]

StartingPathCourse:
  type: object
  required: [id, slug, title, cefr_from, cefr_to, start_lesson]
  properties:
    id:
      type: string
      format: uuid
    slug:
      type: string
    title:
      type: string
    cefr_from:
      type: string
    cefr_to:
      type: string
    start_lesson:
      description: The first lesson at or above the level.
      anyOf:
        - $ref: '#/StartingPathLesson'
        - type: 'null'

StartingPath:
  type: object
  required: [level, level_source, courses]
  properties:
    level:
      type: string
      enum: [A1, A2, B1, B2, C1, C2]
    level_source:
      type: string
      enum: [placement, declared, default]
      description: >-
        The current placement result; failing that the declared level; failing
        that A2. Only a placement opens lessons below the level.
    courses:
      type: array
      items:
        $ref: '#/StartingPathCourse'

WeeklyPlanItem:
  type: object
  required: [kind, minutes, done]
  properties:
    kind:
      type: string
      enum: [lesson, daily_practice, reviews, writing, speaking]
    minutes:
      type: integer
      minimum: 1
    lesson_id:
      type: string
      format: uuid
    course_id:
      type: string
      format: uuid
    title:
      type: string
    skill:
      type: string
    reviews:
      type: integer
      description: How many due reviews a review item covers.
    focus:
      type: boolean
      description: The extra item for the learner's weakest skill.
    done:
      type: boolean

WeeklyPlanProgress:
  type: object
  required: [minutes, items_done, items_total]
  properties:
    minutes:
      type: integer
      minimum: 0
      description: Minutes from learning sessions this week, read at request time.
    items_done:
      type: integer
      minimum: 0
    items_total:
      type: integer
      minimum: 0

WeeklyPlan:
  type: object
  required: [week_start, minutes_goal, items, progress]
  properties:
    week_start:
      type: string
      format: date
      description: Monday of this week in Asia/Ho_Chi_Minh.
    minutes_goal:
      type: integer
      minimum: 1
      description: The learner's weekly goal, or 90 until they set one.
    items:
      type: array
      items:
        $ref: '#/WeeklyPlanItem'
    progress:
      $ref: '#/WeeklyPlanProgress'

FoundationPathNode:
  type: object
  required: [id, namespace, code, label, attempts, score, mastered, next]
  properties:
    id:
      type: string
      format: uuid
    namespace:
      type: string
      example: grammar
    code:
      type: string
      example: PRESENT_PERFECT
    label:
      type: string
      example: Present Perfect
    cefr_level:
      type: string
      nullable: true
      example: B1
    attempts:
      type: integer
      minimum: 0
      example: 5
    score:
      type: number
      format: float
      minimum: 0
      maximum: 1
      example: 0.85
    mastered:
      type: boolean
      example: true
    next:
      type: boolean
      example: false

LearnerFoundationPath:
  type: object
  required: [target, namespace, items]
  properties:
    target:
      type: string
      example: PRESENT_PERFECT
    namespace:
      type: string
      example: grammar
    items:
      type: array
      items:
        $ref: '#/FoundationPathNode'

