ExamSittingActivity:
  type: object
  description: One drawn item, with its answer key removed.
  required: [id, kind, content_version_id, weight]
  properties:
    id:
      type: string
      format: uuid
    kind:
      type: string
      example: listening_comprehension
    content_version_id:
      type: string
      format: uuid
    config:
      type: object
      additionalProperties: true
      description: The item's learner-facing body. No script, answer, model answer or transcript.
    weight:
      type: integer

ExamSittingSection:
  type: object
  required: [section_position, skill, activities]
  properties:
    section_position:
      type: integer
      minimum: 1
      maximum: 4
    skill:
      type: string
      enum: [listening, reading, writing, speaking]
    activities:
      type: array
      items:
        $ref: '#/ExamSittingActivity'

ExamAttempt:
  type: object
  description: A sitting. Every time in it is the server's.
  required: [id, exam_id, mode, chosen_duration_minutes, unlimited, started_at, deadline_at, remaining_seconds, current_section, status, server_time]
  properties:
    id:
      type: string
      format: uuid
    exam_id:
      type: string
      format: uuid
    exam_slug:
      type: string
    exam_title:
      type: string
    level:
      type: string
      enum: [A2, B1, B2]
    mode:
      type: string
      enum: [exam, practice]
    chosen_duration_minutes:
      type: integer
    unlimited:
      type: boolean
      description: >-
        Practice mode only. True when the sitting opted out of a visible time limit; deadline_at
        is then a backstop, not a real limit, and the client should show elapsed time instead of
        a countdown.
    started_at:
      type: string
      format: date-time
    deadline_at:
      type: string
      format: date-time
    remaining_seconds:
      type: integer
      minimum: 0
    current_section:
      type: integer
      minimum: 1
      maximum: 4
      description: In exam mode, the later of the section the learner reached and the first whose time has not run out.
    section_deadline_at:
      type: string
      format: date-time
      description: Exam mode only. When the current section closes.
    section_remaining_seconds:
      type: integer
      minimum: 0
      description: Exam mode only. Seconds until the current section closes.
    status:
      type: string
      enum: [in_progress, completed, expired]
    submitted_at:
      type: string
      format: date-time
    section_activities:
      type: array
      items:
        $ref: '#/ExamSittingSection'
    draft_answers:
      type: object
      description: Saved answers keyed by activity ID.
      additionalProperties: true
    server_time:
      type: string
      format: date-time

ExamAttemptList:
  type: object
  required: [items, total, sittings_today, daily_limit]
  properties:
    items:
      type: array
      items:
        $ref: '#/ExamAttempt'
    total:
      type: integer
    sittings_today:
      type: integer
      description: Sittings started today, counted in Asia/Ho_Chi_Minh.
    daily_limit:
      type: integer

SaveExamAnswersRequest:
  type: object
  properties:
    section_number:
      type: integer
      minimum: 1
      maximum: 4
    answers:
      type: object
      description: >-
        Answers keyed by activity ID, each at most 32 KiB. In exam mode only items of the
        current section are accepted.
      additionalProperties: true
    integrity_events:
      type: array
      maxItems: 50
      items:
        type: object
        required: [kind]
        properties:
          kind:
            type: string
            enum: [tab_hidden, window_blurred, paste]

SaveExamAnswersResult:
  type: object
  required: [saved, remaining_seconds, current_section]
  properties:
    saved:
      type: boolean
    remaining_seconds:
      type: integer
    current_section:
      type: integer
    section_remaining_seconds:
      type: integer

CompleteExamSectionResult:
  type: object
  required: [current_section, remaining_seconds, submitted]
  properties:
    current_section:
      type: integer
    remaining_seconds:
      type: integer
    section_remaining_seconds:
      type: integer
    submitted:
      type: boolean
      description: True when the section completed was the last and the sitting was submitted.

ExamItemOutcome:
  type: object
  required: [activity_id, content_version_id, kind, status, score, max_score]
  properties:
    activity_id:
      type: string
      format: uuid
    content_version_id:
      type: string
      format: uuid
    kind:
      type: string
    attempt_id:
      type: string
      format: uuid
      description: The learning attempt the answer became. Absent for an unanswered item.
    status:
      type: string
      enum: [graded, pending, failed, unanswered]
    score:
      type: integer
    max_score:
      type: integer
    item_results:
      type: array
      items:
        type: object
        additionalProperties: true
    feedback:
      type: string
      description: The grader's message for this item.
    response:
      type: object
      additionalProperties: true
      description: >-
        What the learner answered, as saved in the sitting. Present on a submitted
        sitting's report only.
    content:
      type: object
      additionalProperties: true
      description: >-
        The item as authored — questions, options, the correct answers, the script
        or passage, and explanations. Present on a submitted sitting's report only,
        so no answer reaches the learner before grading.

ExamSectionOutcome:
  type: object
  required: [position, skill, status, max_score, items]
  properties:
    position:
      type: integer
    skill:
      type: string
      enum: [listening, reading, writing, speaking]
    status:
      type: string
      enum: [scored, pending, not_scored]
    score:
      type: integer
      minimum: 0
      maximum: 100
      description: Present only when the section is scored. A section that is not scored has no score, never zero.
    max_score:
      type: integer
    items:
      type: array
      items:
        $ref: '#/ExamItemOutcome'

ExamIntegritySignal:
  type: object
  required: [kind, count]
  properties:
    kind:
      type: string
      enum: [tab_hidden, window_blurred, paste]
    count:
      type: integer

ExamScoreReport:
  type: object
  required: [attempt_id, mode, status, overall_score, per_section, integrity_signals, disclaimer]
  properties:
    attempt_id:
      type: string
      format: uuid
    mode:
      type: string
      enum: [exam, practice]
    submitted_by:
      type: string
      enum: [learner, expiry]
    status:
      type: string
      enum: [pending, ready, partial]
    overall_score:
      type: number
      description: Mean of the scored sections, 0–100.
    overall_band:
      type: string
      description: Estimated CEFR band. Absent until a section is scored.
    published_score:
      type: number
      nullable: true
      description: >-
        The overall on the exam's own scale (an IELTS band, a TOEIC scaled
        estimate, a VSTEP level), when the version states one.
    published_scale:
      type: string
      description: The scale published_score is on, e.g. band, raw_with_estimate, vstep.
    score_is_estimate:
      type: boolean
      description: >-
        True when the exam owner publishes no raw-to-score conversion, so the
        published_score is our estimate and must be labelled so.
    per_section:
      type: array
      items:
        $ref: '#/ExamSectionOutcome'
    integrity_signals:
      type: array
      items:
        $ref: '#/ExamIntegritySignal'
    disclaimer:
      type: string
    elapsed_seconds:
      type: integer
      minimum: 0
      description: Seconds between started_at and submitted_at — how long the learner took.

BlueprintSummary:
  type: object
  required: [id, name, cefr_distribution, node_distribution]
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
      example: toeic_default
    cefr_distribution:
      type: object
      additionalProperties: true
      example:
        B1: 0.5
        B2: 0.5
    node_distribution:
      type: object
      additionalProperties: true
      example: {}

ExamVersion:
  type: object
  required: [id, exam_family, code, title, total_minutes, scoring, source_url, verified_at, is_current, notes, blueprints, distinct_tests_possible, fixed_test_count, parts]
  properties:
    id:
      type: string
      format: uuid
    exam_family:
      type: string
      example: toeic_lr
    code:
      type: string
      example: TOEIC_LR_2026
    title:
      type: string
      example: TOEIC Listening & Reading (2026)
    total_minutes:
      type: integer
      example: 120
    scoring:
      type: object
      additionalProperties: true
    source_url:
      type: string
      format: uri
      example: https://www.etsglobal.org/dz/en/help-center/test-content/format-questions-toeic-listening-reading
    verified_at:
      type: string
      format: date
      example: "2026-09-20"
    is_current:
      type: boolean
      example: true
    notes:
      type: string
      example: "7 parts, 200 questions"
    blueprints:
      type: array
      items:
        $ref: '#/BlueprintSummary'
    distinct_tests_possible:
      type: integer
      description: >-
        How many distinct tests the published bank can compose for this version
        (the coverage report's number). Shown to learners so the product never
        implies more tests than the bank holds.
      example: 2
    fixed_test_count:
      type: integer
      description: >-
        How many numbered fixed tests ("Đề 1 … Đề N") exist for this version
        (WO 22 Stage J). Not distinct_tests_possible: that is what the bank
        could compose, this is what a learner can open.
      example: 5
    parts:
      type: array
      description: >-
        The version's structure, so a custom composition can name the parts it
        wants. Counts of available bank items are not here; those stay in the
        admin coverage report.
      items:
        type: object
        required: [part_number, section, kind, question_count, group_size]
        properties:
          part_number:
            type: integer
            example: 1
          section:
            type: string
            example: listening
          kind:
            type: string
            example: photo_description
          question_count:
            type: integer
            example: 6
          group_size:
            type: integer
            example: 1

ExamVersionListResponse:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: '#/ExamVersion'

StartAttemptRequest:
  type: object
  description: >-
    The body both a sitting start (POST /exams/{id}/attempts) and a mock test
    start (POST /mock-tests/{id}/attempts) accept, so the two cannot drift.
  required: [mode]
  properties:
    mode:
      type: string
      enum: [exam, practice]
    chosen_duration_minutes:
      type: integer
      minimum: 10
      maximum: 180
    unlimited:
      type: boolean
      description: >-
        Practice mode only. Skips chosen_duration_minutes and runs the sitting
        without a visible time limit. The server still applies a generous
        backstop deadline so an abandoned sitting cannot block a future one.
    sections:
      type: array
      description: >-
        Practice mode only: the sections to sit, by position. Omitted or empty
        means all four. A position outside 1–4 or repeated is 400
        EXAM_INVALID_SECTIONS.
      maxItems: 4
      items:
        type: integer
        minimum: 1
        maximum: 4

ComposeMockTestRequest:
  type: object
  required: [blueprint_id, mode]
  properties:
    blueprint_id:
      type: string
      format: uuid
    mode:
      type: string
      enum: [fixed, random, weak_topic, full, custom]
      example: random
    parts:
      type: array
      items:
        type: integer
      description: Optional list of part numbers for custom mode

MockTestPartComposition:
  type: object
  required: [part_id, activity_ids]
  properties:
    part_id:
      type: string
      format: uuid
    activity_ids:
      type: array
      items:
        type: string
        format: uuid

MockTest:
  type: object
  required: [id, blueprint_id, mode, seed, composition, created_at]
  properties:
    id:
      type: string
      format: uuid
    blueprint_id:
      type: string
      format: uuid
    mode:
      type: string
      enum: [fixed, random, weak_topic, full, custom]
    number:
      type: integer
      nullable: true
      description: >-
        The fixed test's number ("Đề 3"); null unless mode is fixed.
      example: 3
    seed:
      type: integer
      format: int64
      example: 1234567890
    composition:
      type: array
      items:
        $ref: '#/MockTestPartComposition'
    owner_id:
      type: string
      format: uuid
      nullable: true
    created_at:
      type: string
      format: date-time

FixedTestSummary:
  type: object
  required: [id, number, title, question_count, minutes]
  properties:
    id:
      type: string
      format: uuid
    number:
      type: integer
      example: 3
    title:
      type: string
      description: The test's display title, in Vietnamese ("Đề 3").
      example: "Đề 3"
    question_count:
      type: integer
      example: 200
    minutes:
      type: integer
      example: 120
    latest_attempt:
      description: The calling learner's most recent attempt at this test; absent when there is none.
      allOf:
        - $ref: '#/FixedTestAttemptSummary'

FixedTestAttemptSummary:
  type: object
  required: [attempt_id, status]
  properties:
    attempt_id:
      type: string
      format: uuid
    status:
      type: string
      example: submitted
    score:
      type: number
      nullable: true
      example: 750
    band:
      type: string
      nullable: true
      example: "6.5"

FixedTestListResponse:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: '#/FixedTestSummary'

ExamPartCoverage:
  type: object
  required: [part_id, part_number, section, kind, question_count, group_size, published_groups_available, groups_needed_per_test, tests_possible]
  properties:
    part_id:
      type: string
      format: uuid
    part_number:
      type: integer
      example: 1
    section:
      type: string
      example: listening
    kind:
      type: string
      example: photo_description
    question_count:
      type: integer
      example: 6
    group_size:
      type: integer
      example: 1
    published_groups_available:
      type: integer
      example: 12
    groups_needed_per_test:
      type: integer
      example: 6
    tests_possible:
      type: integer
      example: 2

ExamCoverageReport:
  type: object
  required: [version_id, exam_code, distinct_tests_possible, parts]
  properties:
    version_id:
      type: string
      format: uuid
    exam_code:
      type: string
      example: TOEIC_LR_2026
    distinct_tests_possible:
      type: integer
      example: 2
    bottleneck_part_id:
      type: string
      format: uuid
      nullable: true
    parts:
      type: array
      items:
        $ref: '#/ExamPartCoverage'

