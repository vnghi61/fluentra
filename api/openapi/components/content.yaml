CEFRLevel:
  type: string
  enum: [A1, A2, B1, B2, C1, C2]
  description: CEFR proficiency level.

AuthoringStatus:
  type: string
  enum: [draft, in_review, approved, published, archived]
  description: Content lifecycle status.

TaxonomyTag:
  type: object
  description: Controlled taxonomy classification.
  required: [namespace, code, label]
  properties:
    namespace:
      type: string
      example: topic
    code:
      type: string
      example: environment
    label:
      type: string
      example: Environment & Climate

MediaAssetSummary:
  type: object
  description: Attached media asset reference.
  required: [id, kind, object_key, status]
  properties:
    id:
      type: string
      format: uuid
    kind:
      type: string
      example: audio
    object_key:
      type: string
      example: audio/words/environment-us.mp3
    duration_ms:
      type: integer
      nullable: true
      example: 1200
    status:
      type: string
      example: ready

ContentVersion:
  type: object
  description: Immutable content version snapshot.
  required: [id, item_id, version, kind, body, cefr_level, status]
  properties:
    id:
      type: string
      format: uuid
    item_id:
      type: string
      format: uuid
    version:
      type: integer
      example: 1
    kind:
      type: string
      example: vocab_word
    body:
      type: object
      description: Skill-specific payload validated by kind schema.
    cefr_level:
      $ref: '#/CEFRLevel'
    status:
      $ref: '#/AuthoringStatus'
    media_refs:
      type: array
      items:
        type: string
    tags:
      type: array
      items:
        $ref: '#/TaxonomyTag'
    published_at:
      type: string
      format: date-time
      nullable: true

ContentItem:
  type: object
  description: Stable identity for a piece of learning material.
  required: [id, kind, slug, status, owner_id, created_at, updated_at]
  properties:
    id:
      type: string
      format: uuid
    kind:
      type: string
      example: vocab_word
    slug:
      type: string
      example: environment-n-1
    current_version_id:
      type: string
      format: uuid
      nullable: true
    status:
      $ref: '#/AuthoringStatus'
    owner_id:
      type: string
      format: uuid
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

ContentVersionList:
  type: object
  required: [items, total]
  properties:
    items:
      type: array
      items:
        $ref: '#/ContentVersion'
    total:
      type: integer

CreateContentItemRequest:
  type: object
  required: [kind, slug, cefr_level, body]
  properties:
    kind:
      type: string
      example: vocab_word
    slug:
      type: string
      example: climate-change-reading-1
    cefr_level:
      $ref: '#/CEFRLevel'
    body:
      type: object
      description: Initial payload for draft version.
    tags:
      type: array
      items:
        type: string

UpdateDraftRequest:
  type: object
  required: [body]
  properties:
    cefr_level:
      $ref: '#/CEFRLevel'
    body:
      type: object
    tags:
      type: array
      items:
        type: string

ReviewDecisionRequest:
  type: object
  required: [decision]
  properties:
    decision:
      type: string
      enum: [approved, changes_requested]
    comments:
      type: string
      nullable: true

AdminContentItemList:
  type: object
  required: [items, total, limit, offset]
  properties:
    items:
      type: array
      items:
        $ref: '#/ContentItem'
    total:
      type: integer
    limit:
      type: integer
    offset:
      type: integer

AdminContentItemDetail:
  type: object
  required: [id, kind, slug, status, owner_id, created_at, updated_at, versions]
  properties:
    id:
      type: string
      format: uuid
    kind:
      type: string
      example: vocab_word
    slug:
      type: string
      example: environment-n-1
    current_version_id:
      type: string
      format: uuid
      nullable: true
    status:
      $ref: '#/AuthoringStatus'
    owner_id:
      type: string
      format: uuid
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
    versions:
      type: array
      items:
        $ref: '#/ContentVersion'

ItemReportReason:
  type: string
  enum: [wrong_answer, unclear, typo, my_answer_was_right, other]
  description: Why the learner is reporting this item.

CreateItemReportRequest:
  type: object
  required: [reason]
  properties:
    reason:
      $ref: '#/ItemReportReason'
    note:
      type: string
      maxLength: 500
      nullable: true
      description: Optional comment explaining the problem.

ItemReport:
  type: object
  required: [id, content_version_id, user_id, reason, created_at]
  properties:
    id:
      type: string
      format: uuid
    content_version_id:
      type: string
      format: uuid
    user_id:
      type: string
      format: uuid
    reason:
      $ref: '#/ItemReportReason'
    note:
      type: string
      nullable: true
    created_at:
      type: string
      format: date-time

ReportedContentVersion:
  type: object
  required: [content_version_id, item_id, slug, kind, cefr_level, item_status, report_count, last_reported_at]
  properties:
    content_version_id:
      type: string
      format: uuid
    item_id:
      type: string
      format: uuid
    slug:
      type: string
    kind:
      type: string
    cefr_level:
      type: string
    item_status:
      type: string
    report_count:
      type: integer
      description: Number of distinct learners who reported this version.
    last_reported_at:
      type: string
      format: date-time

ReportedContentList:
  type: object
  required: [items, total, limit, offset]
  properties:
    items:
      type: array
      items:
        $ref: '#/ReportedContentVersion'
    total:
      type: integer
    limit:
      type: integer
    offset:
      type: integer

TaxonomyNamespace:
  type: string
  enum: [course_topic, grammar, vocabulary, pattern, pronunciation, skill]
  description: Canonical namespace for a taxonomy node.

FoundationTopic:
  type: object
  description: A canonical knowledge spine taxonomy entry.
  required: [id, namespace, code, label, description, position, created_at, updated_at]
  properties:
    id:
      type: string
      format: uuid
    namespace:
      $ref: '#/TaxonomyNamespace'
    code:
      type: string
      example: PRESENT_PERFECT
    label:
      type: string
      example: Present Perfect
    description:
      type: string
      example: Express experience and unfinished actions.
    cefr_level:
      $ref: '#/CEFRLevel'
      nullable: true
    parent_id:
      type: string
      format: uuid
      nullable: true
    position:
      type: integer
      example: 10
    deprecated_at:
      type: string
      format: date-time
      nullable: true
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

FoundationTopicDetail:
  type: object
  description: Detailed view of a foundation topic including graph relations and content counts.
  required: [id, namespace, code, label, description, position, created_at, updated_at, prerequisites, dependants, related, exercise_count, quiz_count, review_count]
  properties:
    id:
      type: string
      format: uuid
    namespace:
      $ref: '#/TaxonomyNamespace'
    code:
      type: string
      example: PRESENT_PERFECT
    label:
      type: string
      example: Present Perfect
    description:
      type: string
    cefr_level:
      $ref: '#/CEFRLevel'
      nullable: true
    parent_id:
      type: string
      format: uuid
      nullable: true
    position:
      type: integer
    deprecated_at:
      type: string
      format: date-time
      nullable: true
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
    body:
      type: object
      nullable: true
      description: Published foundation topic body payload, if published.
    prerequisites:
      type: array
      items:
        $ref: '#/FoundationTopic'
    dependants:
      type: array
      items:
        $ref: '#/FoundationTopic'
    related:
      type: array
      items:
        type: string
    exercise_count:
      type: integer
      description: Number of exercise items attached to this topic.
    quiz_count:
      type: integer
      description: Number of quiz items attached to this topic.
    review_count:
      type: integer
      description: Number of review question items attached to this topic.

FoundationTopicList:
  type: object
  required: [items, total, limit, offset]
  properties:
    items:
      type: array
      items:
        $ref: '#/FoundationTopic'
    total:
      type: integer
    limit:
      type: integer
    offset:
      type: integer

FoundationPath:
  type: object
  description: Topologically sorted learning path of foundation topics.
  required: [namespace, items]
  properties:
    target:
      type: string
      nullable: true
      description: Target topic code, if requested with ?target.
      example: PRESENT_PERFECT
    namespace:
      $ref: '#/TaxonomyNamespace'
    items:
      type: array
      items:
        $ref: '#/FoundationTopic'

CreateFoundationTopicRequest:
  type: object
  required: [namespace, code, label]
  properties:
    namespace:
      $ref: '#/TaxonomyNamespace'
    code:
      type: string
      pattern: '^[A-Z][A-Z0-9]*(_[A-Z0-9]+)*$'
      example: PRESENT_PERFECT
    label:
      type: string
      example: Present Perfect
    description:
      type: string
      example: Express experience and unfinished actions.
    cefr_level:
      $ref: '#/CEFRLevel'
      nullable: true
    parent_id:
      type: string
      format: uuid
      nullable: true
    position:
      type: integer
      default: 0

UpdateFoundationTopicRequest:
  type: object
  description: Update topic metadata. Code is immutable and cannot be updated.
  properties:
    label:
      type: string
    description:
      type: string
    cefr_level:
      $ref: '#/CEFRLevel'
      nullable: true
    parent_id:
      type: string
      format: uuid
      nullable: true
    position:
      type: integer
    deprecated:
      type: boolean
      description: Set to true to deprecate this topic, or false to restore it.

ReplacePrerequisitesRequest:
  type: object
  required: [requires_codes]
  properties:
    requires_codes:
      type: array
      description: Complete set of prerequisite topic codes within the same namespace.
      items:
        type: string
        example: PAST_SIMPLE

AdminReviewQueueItem:
  type: object
  description: A machine-generated draft version awaiting human editorial review.
  required: [id, item_id, slug, kind, cefr_level, status, body, created_at]
  properties:
    id:
      type: string
      format: uuid
      description: Content version ID.
    item_id:
      type: string
      format: uuid
      description: Content item ID.
    slug:
      type: string
      example: foundation-b1-grammar-tense-choice-a1b2c3d4
    kind:
      type: string
      example: grammar_tense_choice
    cefr_level:
      $ref: '#/CEFRLevel'
    status:
      $ref: '#/AuthoringStatus'
    body:
      type: object
      description: Unredacted version payload including exercise structure and answer keys.
      additionalProperties: true
    blind_solve_answer:
      type: object
      description: Answer predicted by blind solver next to the key.
      additionalProperties: true
    cefr_reasoning:
      type: string
      example: Present perfect with clear time markers corresponding to B1 level.
    provenance:
      type: object
      description: Machine author provenance (prompt version, model, ai request ID).
      additionalProperties: true
    node_codes:
      type: array
      items:
        type: string
      example: [PRESENT_PERFECT]
    created_at:
      type: string
      format: date-time

AdminReviewQueueResponse:
  type: object
  required: [items, total]
  properties:
    items:
      type: array
      items:
        $ref: '#/AdminReviewQueueItem'
    total:
      type: integer
      example: 1



