X-Request-Id:
  description: Correlation ID supplied by the client or generated by the API.
  schema:
    type: string
  example: 01J8XQ7Z9K3M4N5P6Q7R8S9T0V
ETag:
  description: Entity tag for a cacheable or mutable resource.
  schema:
    type: string
  example: '"v1-01J8XQ7Z9K3M4N5P6Q7R8S9T0V"'
Cache-Control:
  description: Cache directive; authenticated responses default to no-store.
  schema:
    type: string
  example: no-store
RateLimit-Limit:
  description: Maximum requests permitted in the current rate-limit window.
  schema:
    type: integer
  example: 60
RateLimit-Remaining:
  description: Requests remaining in the current rate-limit window.
  schema:
    type: integer
  example: 59
RateLimit-Reset:
  description: Unix timestamp when the current rate-limit window resets.
  schema:
    type: integer
  example: 1786033260
Set-Cookie-Refresh:
  description: >-
    The rotating refresh token, sent as `HttpOnly; Secure; SameSite=Lax;
    Path=/api/v1/auth`.


    It is deliberately unreadable by script. An access token held in memory
    dies with the tab; a refresh token any injected script could read would be
    a standing takeover of the account, renewable long after the script is
    gone. `Path` narrows it further, so it is not attached to the hundreds of
    ordinary API calls that have no use for it.


    `Secure` is dropped only when `APP_ENV=local`, where the SPA is served over
    plain HTTP and a `Secure` cookie would be discarded by the browser rather
    than merely unprotected.
  schema:
    type: string
  example: >-
    refresh_token=opaque-value; Path=/api/v1/auth; Max-Age=2592000; HttpOnly;
    Secure; SameSite=Lax
Retry-After:
  description: Number of seconds before the request may be retried.
  schema:
    type: integer
    minimum: 0
  example: 30
